<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeVibe</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="/icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20 overflow-x-hidden">

    <div id="main-screen" class="max-w-xl mx-auto p-4 sm:p-6 transition-all duration-300">
        <header class="mb-8 flex justify-between items-center mt-2">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">HomeVibe</h1>
                <p class="text-sm text-slate-500">Zarządzanie domem</p>
            </div>
            <button onclick="openNewTaskModal()" class="w-10 h-10 bg-indigo-600 text-white rounded-full hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200 active:scale-95 flex items-center justify-center text-2xl pb-1">
                +
            </button>
        </header>

        <div id="dashboard-list" class="flex flex-col space-y-3">
            <p class="text-slate-400 text-sm italic text-center py-10">Ładowanie Twojego planu dnia...</p>
        </div>
    </div>

    <div id="settings-screen" class="hidden fixed inset-0 bg-slate-50 z-40 overflow-y-auto flex flex-col transition-all duration-300">
        <div class="max-w-xl mx-auto w-full p-4 sm:p-6 flex-1 flex flex-col pt-8">
            <button onclick="closeSettingsScreen()" class="flex items-center text-slate-500 font-semibold mb-6 active:scale-95 transition-transform w-fit">
                <span class="text-xl mr-2">←</span> Wróć
            </button>

            <h2 class="text-2xl font-bold text-slate-800 mb-6" id="settings-title">Ustawienia</h2>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 mb-6">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Parametry</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Nazwa czynności</label>
                        <input type="text" id="set-task-name" class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 text-sm font-medium text-slate-800">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Powtarzaj co ile dni (0 = brak)</label>
                        <input type="number" id="set-task-interval" class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 text-sm font-medium">
                    </div>
                    <button onclick="saveTaskSettings()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl active:scale-95 transition-all shadow-md shadow-indigo-100">
                        Zapisz zmiany
                    </button>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 mb-6 flex-1">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Historia wykonania</h3>
                <div id="settings-history-list" class="space-y-3"></div>
            </div>

            <div class="mt-auto pt-6 pb-6">
                <button onclick="deleteCurrentTask()" class="w-full bg-red-50 text-red-600 font-bold py-3 rounded-xl active:scale-95 transition-all border border-red-100">
                    Usuń czynność z aplikacji
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-sm font-medium px-5 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 translate-y-10 pointer-events-none z-50 whitespace-nowrap">
        Wiadomość
    </div>

    <div id="new-task-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Nowa czynność</h3>
            <div class="space-y-4">
                <input type="text" id="new-task-name" placeholder="Nazwa (np. Filtry)" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium">
                <input type="number" id="new-task-interval" placeholder="Częstotliwość (dni)" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium">
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="closeNewTaskModal()" class="flex-1 bg-slate-100 text-slate-600 font-semibold py-3 rounded-xl active:scale-95">Anuluj</button>
                <button onclick="saveNewTask()" class="flex-1 bg-indigo-600 text-white font-semibold py-3 rounded-xl active:scale-95 shadow-md">Dodaj</button>
            </div>
        </div>
    </div>

    <div id="add-log-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800 mb-1">Wykonano!</h3>
            <p class="text-sm text-slate-500 mb-4 font-medium" id="add-log-subtitle"></p>
            <input type="hidden" id="add-log-name">
            <div class="space-y-4">
                <input type="date" id="add-log-date" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium">
                <textarea id="add-log-notes" placeholder="Notatki (opcjonalnie)..." class="w-full p-3 rounded-xl border border-slate-200 text-sm h-20 resize-none"></textarea>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="closeAddLogModal()" class="flex-1 bg-slate-100 text-slate-600 font-semibold py-3 rounded-xl active:scale-95">Anuluj</button>
                <button onclick="saveNewLog()" class="flex-1 bg-emerald-600 text-white font-semibold py-3 rounded-xl active:scale-95 shadow-md">Zapisz</button>
            </div>
        </div>
    </div>

    <div id="edit-log-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[60] flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl border border-slate-100">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Edytuj wpis</h3>
            <input type="hidden" id="edit-log-id">
            <div class="space-y-4">
                <input type="date" id="edit-log-date" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium">
                <textarea id="edit-log-notes" class="w-full p-3 rounded-xl border border-slate-200 text-sm h-24 resize-none"></textarea>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="closeEditLogModal()" class="flex-1 bg-slate-100 text-slate-600 font-semibold py-3 rounded-xl active:scale-95">Anuluj</button>
                <button onclick="saveEditLog()" class="flex-1 bg-indigo-600 text-white font-semibold py-3 rounded-xl active:scale-95 shadow-md">Zapisz</button>
            </div>
        </div>
    </div>

    <script>
        // --- REJESTRACJA SERVICE WORKERA (DLA PWA) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('Service Worker zarejestrowany', reg);
                }).catch(err => {
                    console.log('Błąd rejestracji Service Workera', err);
                });
            });
        }

        // --- KONFIGURACJA SUPABASE ---
        const SUPABASE_URL = 'https://znrrvqgqxjxgahpfuqkm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpucnJ2cWdxeGp4Z2FocGZ1cWttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MTQwMjcsImV4cCI6MjA5MjA5MDAyN30.-G3UiUGsDaca7KomB4dv9sWxDcIvFqik_xpEMAW3jAM';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allLogs = [];
        let allTasks = [];
        let currentSettingsTaskName = '';
        let toastTimeout;

        function getRelativeTime(dateString) {
            const today = new Date(); today.setHours(0,0,0,0);
            const target = new Date(dateString); target.setHours(0,0,0,0);
            const diffDays = Math.floor((today - target) / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return "dzisiaj";
            if (diffDays === 1) return "wczoraj";
            if (diffDays === 2) return "przedwczoraj";
            if (diffDays < 7) return `${diffDays} dni temu`;
            if (diffDays < 14) return "tydzień temu";
            if (diffDays < 31) return `${Math.floor(diffDays/7)} tyg. temu`;
            if (diffDays <= 180) return "ponad miesiąc temu";
            if (diffDays <= 365) return "ponad pół roku temu";
            return "ponad rok temu";
        }

        function getCompactStatus(latestDate, interval) {
            if (!latestDate) return { color: 'text-slate-400', label: 'Brak wpisów', tooltip: 'Zadanie nigdy nie było wykonane.' };
            const relTime = getRelativeTime(latestDate);
            if (!interval || interval <= 0) return { color: 'text-slate-400', label: relTime, tooltip: 'Brak harmonogramu (nie przypominam).' };

            const last = new Date(latestDate); last.setHours(0,0,0,0);
            const today = new Date(); today.setHours(0,0,0,0);
            const nextDue = new Date(last); nextDue.setDate(last.getDate() + interval);
            const diffDays = Math.ceil((nextDue - today) / (1000 * 60 * 60 * 24));

            if (diffDays < 0) return { color: 'text-red-500 font-bold', label: relTime, tooltip: `Przeterminowane o ${Math.abs(diffDays)} dni.` };
            if (diffDays === 0) return { color: 'text-amber-500 font-bold', label: relTime, tooltip: 'Kolejne wykonanie: Dzisiaj!' };
            return { color: 'text-emerald-500 font-semibold', label: relTime, tooltip: `Kolejne wykonanie za ${diffDays} dni.` };
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0', 'translate-y-10');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-10');
            }, 3000);
        }

        async function loadDashboard() {
            const list = document.getElementById('dashboard-list');
            const [tasksRes, logsRes] = await Promise.all([
                supabaseClient.from('tasks').select('*').order('name', { ascending: true }),
                supabaseClient.from('activity_logs').select('*').order('created_at', { ascending: false })
            ]);

            allTasks = tasksRes.data || [];
            allLogs = logsRes.data || [];

            if(allTasks.length === 0) {
                list.innerHTML = `<p class="text-center text-slate-400 py-10">Brak zadań. Kliknij + aby zacząć.</p>`;
                return;
            }

            list.innerHTML = allTasks.map(task => {
                const latestLog = allLogs.find(l => l.activity_name === task.name);
                const status = getCompactStatus(latestLog?.created_at, task.interval_days);
                const safeName = encodeURIComponent(task.name);
                const safeTooltip = status.tooltip.replace(/'/g, "\\'");

                return `
                    <div class="flex items-center justify-between p-4 bg-white rounded-2xl shadow-sm border border-slate-100">
                        <div class="flex-1 cursor-pointer pr-4" onclick="showToast('${safeTooltip}')">
                            <h3 class="font-bold text-slate-800 text-base leading-tight">${task.name}</h3>
                            <p class="text-[13px] ${status.color} mt-0.5">${status.label}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="openAddLogModal('${safeName}')" class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 font-bold text-2xl flex items-center justify-center pb-1 active:scale-90 transition-transform">
                                +
                            </button>
                            <button onclick="openSettingsScreen('${safeName}')" class="w-10 h-10 rounded-full bg-slate-50 text-slate-500 text-lg flex items-center justify-center active:scale-90 transition-transform">
                                ⚙️
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openSettingsScreen(encodedName) {
            currentSettingsTaskName = decodeURIComponent(encodedName);
            const task = allTasks.find(t => t.name === currentSettingsTaskName);
            
            document.getElementById('settings-title').innerText = currentSettingsTaskName;
            document.getElementById('set-task-name').value = task.name;
            document.getElementById('set-task-interval').value = task.interval_days;
            
            renderSettingsHistory();
            
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('settings-screen').classList.remove('hidden');
        }

        function closeSettingsScreen() {
            document.getElementById('settings-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            loadDashboard();
        }

        async function saveTaskSettings() {
            const newName = document.getElementById('set-task-name').value.trim();
            const interval = parseInt(document.getElementById('set-task-interval').value) || 0;
            if (!newName) return alert("Podaj nazwę!");

            if (currentSettingsTaskName !== newName) {
                await supabaseClient.from('activity_logs').update({ activity_name: newName }).eq('activity_name', currentSettingsTaskName);
                await supabaseClient.from('tasks').insert([{ name: newName, interval_days: interval }]);
                await supabaseClient.from('tasks').delete().eq('name', currentSettingsTaskName);
                currentSettingsTaskName = newName;
                document.getElementById('settings-title').innerText = newName;
            } else {
                await supabaseClient.from('tasks').update({ interval_days: interval }).eq('name', currentSettingsTaskName);
            }
            showToast('Ustawienia zapisane!');
            const tasksRes = await supabaseClient.from('tasks').select('*');
            allTasks = tasksRes.data || [];
        }

        async function deleteCurrentTask() {
            if(!confirm(`Trwale usunąć "${currentSettingsTaskName}" z aplikacji?`)) return;
            await supabaseClient.from('tasks').delete().eq('name', currentSettingsTaskName);
            closeSettingsScreen();
        }

        function renderSettingsHistory() {
            const logs = allLogs.filter(l => l.activity_name === currentSettingsTaskName);
            const container = document.getElementById('settings-history-list');
            
            container.innerHTML = logs.length ? logs.map(l => `
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center group">
                    <div>
                        <p class="text-sm font-bold text-slate-700">${new Date(l.created_at).toLocaleDateString('pl-PL')}</p>
                        ${l.notes ? `<p class="text-[11px] text-slate-500 mt-0.5 line-clamp-1">${l.notes}</p>` : ''}
                    </div>
                    <div class="flex gap-1">
                        <button onclick="openEditLogModal(${l.id}, '${l.created_at.split('T')[0]}', '${encodeURIComponent(l.notes || '')}')" class="w-8 h-8 flex justify-center items-center text-slate-400 hover:text-indigo-500">✏️</button>
                        <button onclick="deleteLog(${l.id})" class="w-8 h-8 flex justify-center items-center text-slate-400 hover:text-red-500">🗑️</button>
                    </div>
                </div>
            `).join('') : '<p class="text-center py-4 text-slate-400 text-sm italic">Brak wpisów.</p>';
        }

        function openNewTaskModal() {
            document.getElementById('new-task-name').value = '';
            document.getElementById('new-task-interval').value = '';
            document.getElementById('new-task-modal').classList.remove('hidden');
        }
        function closeNewTaskModal() { document.getElementById('new-task-modal').classList.add('hidden'); }

        async function saveNewTask() {
            const name = document.getElementById('new-task-name').value.trim();
            const interval = parseInt(document.getElementById('new-task-interval').value) || 0;
            if (!name) return alert("Podaj nazwę!");
            await supabaseClient.from('tasks').insert([{ name: name, interval_days: interval }]);
            closeNewTaskModal(); loadDashboard();
        }

        function openAddLogModal(encodedName) {
            const name = decodeURIComponent(encodedName);
            document.getElementById('add-log-subtitle').innerText = name;
            document.getElementById('add-log-name').value = name;
            document.getElementById('add-log-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('add-log-notes').value = '';
            document.getElementById('add-log-modal').classList.remove('hidden');
        }
        function closeAddLogModal() { document.getElementById('add-log-modal').classList.add('hidden'); }

        async function saveNewLog() {
            const name = document.getElementById('add-log-name').value;
            const date = document.getElementById('add-log-date').value;
            const notes = document.getElementById('add-log-notes').value;
            await supabaseClient.from('activity_logs').insert([{
                activity_name: name, created_at: `${date}T12:00:00.000Z`, notes: notes || null
            }]);
            closeAddLogModal(); loadDashboard();
        }

        async function deleteLog(id) {
            if(!confirm("Usunąć ten wpis z historii?")) return;
            await supabaseClient.from('activity_logs').delete().eq('id', id);
            const logsRes = await supabaseClient.from('activity_logs').select('*').order('created_at', { ascending: false });
            allLogs = logsRes.data || [];
            renderSettingsHistory();
        }

        function openEditLogModal(id, date, notes) {
            document.getElementById('edit-log-id').value = id;
            document.getElementById('edit-log-date').value = date;
            document.getElementById('edit-log-notes').value = decodeURIComponent(notes);
            document.getElementById('edit-log-modal').classList.remove('hidden');
        }
        function closeEditLogModal() { document.getElementById('edit-log-modal').classList.add('hidden'); }

        async function saveEditLog() {
            const id = document.getElementById('edit-log-id').value;
            const date = document.getElementById('edit-log-date').value;
            const notes = document.getElementById('edit-log-notes').value;
            await supabaseClient.from('activity_logs').update({
                created_at: `${date}T12:00:00.000Z`, notes: notes || null
            }).eq('id', id);
            
            closeEditLogModal();
            const logsRes = await supabaseClient.from('activity_logs').select('*').order('created_at', { ascending: false });
            allLogs = logsRes.data || [];
            renderSettingsHistory();
        }

        loadDashboard();
    </script>
</body>
</html>
