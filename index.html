<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeVibe</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#131314">
    <link rel="apple-touch-icon" href="/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        window.addEventListener('error', function(e) {
            const errBox = document.createElement('div');
            errBox.style.cssText = 'position:fixed; top:0; left:0; width:100%; background:red; color:white; z-index:9999; padding:20px; font-size:12px; word-wrap:break-word;';
            errBox.innerHTML = `<b>BŁĄD KRYTYCZNY:</b> ${e.message}<br><b>Plik:</b> ${e.filename}<br><b>Linia:</b> ${e.lineno}:${e.colno}`;
            document.body.appendChild(errBox);
        });
    </script>

    <script src="/config.js?v=5"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap');
        body { font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #131314; color: #e3e3e3; overscroll-behavior-y: none; }
        
        .hidden { display: none !important; pointer-events: none !important; visibility: hidden !important; }
        
        @media (pointer: coarse) {
            .active\:scale-90:active, .active\:scale-95:active { transform: none !important; opacity: 0.5 !important; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #444746; border-radius: 10px; }
        input:checked ~ .dot { transform: translateX(100%); }
        input:checked ~ .block-bg { background-color: #a8c7fa; }
        input:checked ~ .dot { background-color: #004a77; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        button, [role="button"] { touch-action: manipulation; }
        .swipe-front { touch-action: pan-y; transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .swipe-front button { touch-action: manipulation; } 

        @media (hover: hover) and (pointer: fine) {
            .group:hover .swipe-front { transform: translateX(-64px); }
            .group:hover .js-swipe-item { transform: translateX(-80px) !important; }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden relative">

    <div id="splash-screen" class="fixed inset-0 z-[9999] bg-[#131314] flex flex-col justify-center items-center transition-opacity duration-500">
        <div class="text-7xl mb-6 animate-pulse">✨</div>
        <h1 class="text-2xl font-bold text-neutral-100 tracking-wider">HomeVibe</h1>
        <p class="text-xs text-neutral-500 mt-2 uppercase tracking-widest">Wczytywanie...</p>
    </div>

    <div id="ptr-indicator" class="fixed top-0 left-0 w-full flex justify-center items-center z-50 pointer-events-none" style="transform: translateY(-100%); transition: transform 0.3s ease-out;">
        <div class="bg-[#1e1f20] border border-[#333537] rounded-full w-10 h-10 shadow-lg flex items-center justify-center mt-4">
            <span id="ptr-icon" class="text-xl text-neutral-400 block transition-transform duration-300">↻</span>
        </div>
    </div>

    <header id="global-nav-header" class="hidden px-4 py-3 flex items-center bg-[#131314] sticky top-0 z-40 border-b border-[#333537]">
        <button class="js-global-go-back flex items-center text-neutral-300 font-medium active:scale-95 w-fit">
            <span class="mr-2 text-xl">←</span> Wróć
        </button>
    </header>

    <main id="main-screen" class="flex-1 overflow-y-auto pb-24 transition-all duration-300" style="-webkit-overflow-scrolling: touch;">
        <div id="view-container"></div>
        <div id="view-auth" class="hidden fixed inset-0 z-[100] bg-[#131314] flex flex-col justify-center items-center p-6 screen-view transition-all duration-300">
            <div class="w-full max-w-sm">
                <div class="text-center mb-10">
                    <div class="text-6xl mb-4">✨</div>
                    <h1 id="auth-title" class="text-2xl font-medium text-neutral-100 tracking-wide mb-2">Witaj z powrotem</h1>
                    <p id="auth-subtitle" class="text-sm text-neutral-400">Zaloguj się, aby zarządzać domem.</p>
                </div>
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-[10px] uppercase tracking-wider text-neutral-500 mb-1 pl-1">Email</label>
                        <input type="email" id="auth-email" maxlength="100" class="w-full p-4 rounded-[20px] bg-[#1e1f20] border border-[#333537] text-neutral-200 text-sm focus:border-[#a8c7fa] focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase tracking-wider text-neutral-500 mb-1 pl-1">Hasło (min. 6 znaków)</label>
                        <input type="password" id="auth-password" maxlength="100" class="w-full p-4 rounded-[20px] bg-[#1e1f20] border border-[#333537] text-neutral-200 text-sm focus:border-[#a8c7fa] focus:outline-none">
                    </div>
                </div>
                <button id="auth-action-btn" class="js-auth-action w-full bg-[#a8c7fa] text-[#004a77] font-bold py-4 rounded-full text-sm mb-6 active:scale-95 transition-transform shadow-lg shadow-[#a8c7fa]/10">Zaloguj się</button>
                <button id="auth-toggle-btn" class="js-auth-toggle w-full text-center text-sm text-neutral-400 font-medium active:scale-95 transition-transform">Nie masz konta? <span class="text-[#a8c7fa]">Zarejestruj się</span></button>
            </div>
        </div>
    </main>

    <nav id="bottom-nav" class="fixed bottom-0 w-full bg-[#1e1f20] border-t border-[#333537] pb-safe z-30 transition-all duration-300">
        <div class="flex justify-around items-center max-w-xl mx-auto h-16">
            <button class="js-dash-nav flex flex-col items-center justify-center w-full h-full text-[#c4eed0] transition-colors" data-view="dashboard" id="nav-dashboard">
                <span class="text-lg mb-1">✨</span><span class="text-[9px] font-medium uppercase tracking-wider">Przegląd</span>
            </button>
            <button class="js-dash-nav flex flex-col items-center justify-center w-full h-full text-neutral-500 hover:text-neutral-300 transition-colors" data-view="home" id="nav-home">
                <span class="text-lg mb-1">🏠</span><span class="text-[9px] font-medium uppercase tracking-wider">Dom</span>
            </button>
            <button class="js-dash-nav flex flex-col items-center justify-center w-full h-full text-neutral-500 hover:text-neutral-300 transition-colors" data-view="todo" id="nav-todo">
                <span class="text-lg mb-1">📝</span><span class="text-[9px] font-medium uppercase tracking-wider">Zadania</span>
            </button>
            <button class="js-dash-nav flex flex-col items-center justify-center w-full h-full text-neutral-500 hover:text-neutral-300 transition-colors" data-view="health" id="nav-health">
                <span class="text-lg mb-1">❤️</span><span class="text-[9px] font-medium uppercase tracking-wider">Zdrowie</span>
            </button>
            <button class="js-dash-nav flex flex-col items-center justify-center w-full h-full text-neutral-500 hover:text-neutral-300 transition-colors" data-view="settings" id="nav-settings">
                <span class="text-lg mb-1">⚙️</span><span class="text-[9px] font-medium uppercase tracking-wider">Ustawienia</span>
            </button>
        </div>
    </nav>

    <div id="search-modal" class="hidden fixed inset-0 bg-[#131314]/95 backdrop-blur-xl z-[150] flex flex-col transition-transform duration-300 transform -translate-y-full">
        <div class="p-4 sm:p-6 border-b border-[#333537] flex items-center gap-3 bg-[#1e1f20] pt-safe shadow-sm">
            <button class="js-close-global-search text-neutral-400 text-2xl active:scale-90 transition-transform pb-1 px-2 cursor-pointer">✕</button>
            <input type="text" id="global-search-input" maxlength="100" placeholder="Szukaj zadań, leków..." class="flex-1 bg-transparent text-neutral-200 text-lg focus:outline-none placeholder-neutral-600">
        </div>
        <div id="search-results-list" class="flex-1 overflow-y-auto p-4 sm:p-6 no-scrollbar pb-24">
            <div class="flex justify-center py-10"><p class="text-xs text-neutral-500">Wpisz minimum 2 znaki...</p></div>
        </div>
    </div>

    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 bg-[#e3e3e3] text-[#131314] text-xs font-medium px-5 py-2.5 rounded-full shadow-2xl transition-all duration-300 opacity-0 -translate-y-10 pointer-events-none z-[200] whitespace-nowrap">Wiadomość</div>

    <div id="confirm-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[200] flex justify-center items-center p-4">
        <div class="bg-[#1e1f20] rounded-[28px] border border-[#333537] w-full max-w-sm p-6 shadow-2xl">
            <h3 id="confirm-message" class="text-base font-medium text-neutral-100 mb-6 tracking-wide text-center leading-relaxed">Czy na pewno?</h3>
            <div class="flex gap-3">
                <button class="js-confirm-modal-btn flex-1 text-neutral-300 font-medium py-3 text-sm rounded-full hover:bg-[#333537] transition-colors" data-result="false">Anuluj</button>
                <button class="js-confirm-modal-btn flex-1 bg-[#ffb4ab] text-[#3c1414] font-bold py-3 text-sm rounded-full active:scale-95 transition-transform" data-result="true">Tak</button>
            </div>
        </div>
    </div>

    <div id="join-household-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[200] flex justify-center items-center p-4">
        <div class="bg-[#1e1f20] rounded-[28px] border border-[#333537] w-full max-w-sm p-6 shadow-2xl">
            <h3 class="text-base font-medium text-neutral-100 mb-2 tracking-wide">Dołącz do domu</h3>
            <p class="text-xs text-neutral-500 mb-6">Wklej identyfikator domu partnera/partnerki.</p>
            <input type="text" id="join-hh-input" maxlength="50" placeholder="ID Domu (UUID)" class="w-full p-4 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none focus:border-[#a8c7fa] mb-6">
            <div class="flex gap-3">
                <button class="js-close-join-household flex-1 text-neutral-300 font-medium py-3 text-sm rounded-full hover:bg-[#333537]">Anuluj</button>
                <button class="js-process-join-household flex-1 bg-[#a8c7fa] text-[#004a77] font-bold py-3 text-sm rounded-full active:scale-95 transition-transform">Dołącz</button>
            </div>
        </div>
    </div>

    <div id="change-user-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[80] flex justify-center items-center p-4">
        <div class="bg-[#131314] rounded-[28px] border border-[#333537] w-full max-w-sm p-6 shadow-2xl">
            <h3 class="text-base font-medium text-neutral-100 mb-4 tracking-wide">Wybierz osobę</h3>
            <input type="hidden" id="change-user-type">
            <input type="hidden" id="change-user-id">
            <div id="change-user-list" class="max-h-48 overflow-y-auto mb-4 hide-scrollbar"></div>
            <div class="flex gap-2">
                <input type="text" id="change-user-custom" maxlength="50" placeholder="Inne imię..." class="flex-1 p-3.5 rounded-[20px] bg-[#1e1f20] border border-[#333537] text-neutral-200 text-sm focus:outline-none focus:border-[#a8c7fa]">
                <button class="js-save-changed-user px-5 bg-[#004a77] text-[#c2e7ff] font-medium rounded-[20px] active:scale-95 transition-transform text-sm">Zapisz</button>
            </div>
            <button class="js-close-change-user w-full mt-4 text-neutral-500 font-medium py-2 text-sm uppercase tracking-widest active:scale-95">Anuluj</button>
        </div>
    </div>
    
    <script src="/events.js?v=6"></script>
    
    <script src="/utils.js?v=6"></script>
    <script src="/store.js?v=6"></script>
    <script src="/components.js?v=6"></script>
    <script src="/user-log.js?v=6"></script>
    <script src="/household.js?v=6"></script>
    <script src="/router.js?v=6"></script> 
    <script src="/auth.js?v=6"></script>
    <script src="/dashboard.js?v=6"></script>
    <script src="/calendar.js?v=6"></script>
    <script src="/home.js?v=6"></script>
    <script src="/health.js?v=6"></script>
    <script src="/todo.js?v=6"></script>
    <script src="/settings.js?v=6"></script>
    <script src="/search.js?v=6"></script>
    <script src="/stats.js?v=6"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof window.checkSession === 'function') {
                window.checkSession();
            } else {
                console.error("Błąd: Funkcja checkSession nie istnieje!");
            }
        });
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('SW zarejestrowany!'))
                .catch(err => console.log('Błąd SW:', err));
        });
    }
    </script>
</body>
</html>
