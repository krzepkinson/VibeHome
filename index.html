<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeVibe</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="/icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        /* Styl dla przełącznika PUSH */
        input:checked ~ .dot { transform: translateX(100%); }
        input:checked ~ .block-bg { background-color: #4f46e5; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden">

    <main class="flex-1 overflow-y-auto pb-24">
        
        <div id="view-home" class="max-w-xl mx-auto p-4 sm:p-6 transition-all duration-300">
            <header class="mb-8 flex justify-between items-center mt-2">
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">HomeVibe</h1>
                    <p class="text-sm text-slate-500">Zarządzanie domem</p>
                </div>
                <button onclick="openNewTaskModal()" class="w-10 h-10 bg-indigo-600 text-white rounded-full hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200 active:scale-95 flex items-center justify-center text-2xl pb-1">
                    +
                </button>
            </header>
            <div id="dashboard-list" class="flex flex-col space-y-3">
                <p class="text-slate-400 text-sm italic text-center py-10">Ładowanie...</p>
            </div>
        </div>

        <div id="view-health" class="hidden max-w-xl mx-auto p-4 sm:p-6 transition-all duration-300">
            <header class="mb-8 flex justify-between items-center mt-2">
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">Zdrowie i Higiena</h1>
                    <p class="text-sm text-slate-500">Wybierz profil domownika</p>
                </div>
                <button onclick="openNewProfileModal()" class="w-10 h-10 bg-rose-500 text-white rounded-full hover:bg-rose-600 transition-all shadow-lg shadow-rose-200 active:scale-95 flex items-center justify-center text-2xl pb-1">
                    +
                </button>
            </header>
            <div id="profiles-list" class="grid grid-cols-2 gap-4">
                </div>
        </div>

        <div id="view-profile" class="hidden max-w-xl mx-auto p-4 sm:p-6 transition-all duration-300">
            <header class="mb-6 mt-2">
                <button onclick="switchView('health')" class="flex items-center text-slate-500 font-semibold mb-4 active:scale-95 w-fit">
                    <span class="mr-2">←</span> Wróć
                </button>
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-800" id="profile-name-title">Imię</h1>
                        <p class="text-sm text-rose-500 font-medium">Karta zdrowia</p>
                    </div>
                    <button onclick="openNewHealthTaskModal()" class="w-10 h-10 bg-rose-500 text-white rounded-full hover:bg-rose-600 transition-all shadow-lg shadow-rose-200 active:scale-95 flex items-center justify-center text-2xl pb-1">
                        +
                    </button>
                </div>
            </header>
            <div id="health-tasks-list" class="flex flex-col space-y-3">
                </div>
        </div>

    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-100 shadow-[0_-4px_20px_rgba(0,0,0,0.02)] pb-safe z-30">
        <div class="flex justify-around items-center max-w-xl mx-auto h-16">
            <button onclick="switchView('home')" id="nav-home" class="flex flex-col items-center justify-center w-full h-full text-indigo-600 transition-colors">
                <span class="text-xl mb-1">🏠</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Dom</span>
            </button>
            <button onclick="switchView('health')" id="nav-health" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-rose-500 transition-colors">
                <span class="text-xl mb-1">❤️</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Zdrowie</span>
            </button>
        </div>
    </nav>

    <div id="new-profile-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Dodaj domownika</h3>
            <input type="text" id="new-profile-name" placeholder="Imię (np. Janek)" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium mb-6 focus:border-rose-500 focus:outline-none">
            <div class="flex gap-3">
                <button onclick="closeNewProfileModal()" class="flex-1 bg-slate-100 text-slate-600 font-semibold py-3 rounded-xl active:scale-95">Anuluj</button>
                <button onclick="saveNewProfile()" class="flex-1 bg-rose-500 text-white font-semibold py-3 rounded-xl active:scale-95 shadow-md">Zapisz</button>
            </div>
        </div>
    </div>

    <div id="new-health-task-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Co chcesz śledzić?</h3>
            <div class="space-y-4">
                <input type="text" id="h-task-name" placeholder="Nazwa (np. Katar, Szczoteczka)" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium focus:border-rose-500 focus:outline-none">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-2 uppercase">Typ śledzenia</label>
                    <select id="h-task-type" onchange="toggleHealthInterval()" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium focus:outline-none bg-white">
                        <option value="cyclical">Cykliczne (np. szczoteczka, leki co X dni)</option>
                        <option value="duration">Trwające (np. katar, gorączka)</option>
                    </select>
                </div>

                <div id="h-task-interval-container">
                    <input type="number" id="h-task-interval" placeholder="Przypomnij co ile dni" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium focus:outline-none focus:border-rose-500">
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="closeNewHealthTaskModal()" class="flex-1 bg-slate-100 text-slate-600 font-semibold py-3 rounded-xl active:scale-95">Anuluj</button>
                <button onclick="saveNewHealthTask()" class="flex-1 bg-rose-500 text-white font-semibold py-3 rounded-xl active:scale-95 shadow-md">Dodaj</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-sm font-medium px-5 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 translate-y-10 pointer-events-none z-50">Wiadomość</div>

    <div id="legacy-modals"></div>

    <script>
        // --- INICJALIZACJA ---
        if (typeof CONFIG === 'undefined') alert('Brak pliku config.js!');
        const supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

        let activeView = 'home';
        let profiles = [];
        let currentProfileId = null;
        let healthTasks = [];
        let toastTimeout;

        // --- NAWIGACJA ---
        function switchView(view) {
            activeView = view;
            
            // Kolory ikon na pasku
            document.getElementById('nav-home').className = `flex flex-col items-center justify-center w-full h-full transition-colors ${view === 'home' ? 'text-indigo-600' : 'text-slate-400 hover:text-indigo-500'}`;
            document.getElementById('nav-health').className = `flex flex-col items-center justify-center w-full h-full transition-colors ${view === 'health' || view === 'profile' ? 'text-rose-500' : 'text-slate-400 hover:text-rose-500'}`;

            // Ukrywanie/pokazywanie ekranów
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-health').classList.add('hidden');
            document.getElementById('view-profile').classList.add('hidden');

            if (view === 'home') {
                document.getElementById('view-home').classList.remove('hidden');
                loadDashboard(); // Ładuje stary moduł domowy
            } else if (view === 'health') {
                document.getElementById('view-health').classList.remove('hidden');
                loadProfiles();
            } else if (view === 'profile') {
                document.getElementById('view-profile').classList.remove('hidden');
                loadProfileDashboard();
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast'); t.innerText = msg;
            t.classList.remove('opacity-0', 'translate-y-10');
            clearTimeout(toastTimeout); toastTimeout = setTimeout(() => t.classList.add('opacity-0', 'translate-y-10'), 3000);
        }

        // ==========================================
        // LOGIKA: ZDROWIE - PROFILE
        // ==========================================
        async function loadProfiles() {
            const list = document.getElementById('profiles-list');
            const { data, error } = await supabaseClient.from('profiles').select('*').order('name');
            profiles = data || [];

            if (profiles.length === 0) {
                list.innerHTML = `<p class="col-span-2 text-center text-slate-400 py-10">Brak profili. Dodaj domownika.</p>`;
                return;
            }

            list.innerHTML = profiles.map(p => `
                <button onclick="openProfile(${p.id}, '${encodeURIComponent(p.name)}')" class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-3 active:scale-95 transition-transform hover:border-rose-200">
                    <div class="w-14 h-14 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center text-2xl font-bold">
                        ${p.name.charAt(0).toUpperCase()}
                    </div>
                    <span class="font-bold text-slate-700">${p.name}</span>
                </button>
            `).join('');
        }

        function openNewProfileModal() { document.getElementById('new-profile-modal').classList.remove('hidden'); }
        function closeNewProfileModal() { document.getElementById('new-profile-modal').classList.add('hidden'); }
        
        async function saveNewProfile() {
            const name = document.getElementById('new-profile-name').value.trim();
            if (!name) return;
            await supabaseClient.from('profiles').insert([{ name }]);
            closeNewProfileModal();
            loadProfiles();
        }

        function openProfile(id, encodedName) {
            currentProfileId = id;
            document.getElementById('profile-name-title').innerText = decodeURIComponent(encodedName);
            switchView('profile');
        }

        // ==========================================
        // LOGIKA: ZDROWIE - KOKPIT OSOBY
        // ==========================================
        async function loadProfileDashboard() {
            const list = document.getElementById('health-tasks-list');
            list.innerHTML = `<p class="text-slate-400 text-sm italic text-center py-10">Ładowanie...</p>`;
            
            const { data, error } = await supabaseClient.from('health_tasks').select('*').eq('profile_id', currentProfileId);
            healthTasks = data || [];

            if (healthTasks.length === 0) {
                list.innerHTML = `<p class="text-center text-slate-400 py-10">Brak śledzonych zdarzeń. Kliknij + na górze.</p>`;
                return;
            }

            list.innerHTML = healthTasks.map(task => {
                const isCyclical = task.task_type === 'cyclical';
                const icon = isCyclical ? '🔄' : '⏱️';
                const typeLabel = isCyclical ? (task.interval_days > 0 ? `Co ${task.interval_days} dni` : 'Brak przypomnień') : 'Trwające wydarzenie (od - do)';

                return `
                    <div class="flex items-center justify-between p-4 bg-white rounded-2xl shadow-sm border border-slate-100">
                        <div class="flex-1 pr-4">
                            <h3 class="font-bold text-slate-800 text-base leading-tight flex items-center gap-2">
                                <span>${icon}</span> ${task.name}
                            </h3>
                            <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mt-1">${typeLabel}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button class="w-10 h-10 rounded-full bg-rose-50 text-rose-500 font-bold text-2xl flex items-center justify-center pb-1 active:scale-90 transition-transform">
                                +
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openNewHealthTaskModal() {
            document.getElementById('h-task-name').value = '';
            document.getElementById('h-task-type').value = 'cyclical';
            document.getElementById('h-task-interval').value = '';
            toggleHealthInterval();
            document.getElementById('new-health-task-modal').classList.remove('hidden');
        }

        function closeNewHealthTaskModal() { document.getElementById('new-health-task-modal').classList.add('hidden'); }

        function toggleHealthInterval() {
            const type = document.getElementById('h-task-type').value;
            const container = document.getElementById('h-task-interval-container');
            if (type === 'duration') container.classList.add('hidden');
            else container.classList.remove('hidden');
        }

        async function saveNewHealthTask() {
            const name = document.getElementById('h-task-name').value.trim();
            const type = document.getElementById('h-task-type').value;
            const interval = document.getElementById('h-task-interval').value;
            
            if (!name) return;
            
            await supabaseClient.from('health_tasks').insert([{ 
                profile_id: currentProfileId,
                name: name, 
                task_type: type,
                interval_days: type === 'cyclical' ? (parseInt(interval) || 0) : 0
            }]);
            
            closeNewHealthTaskModal();
            loadProfileDashboard();
        }

        // Uruchom widok domowy przy starcie
        switchView('home');

        // UWAGA: Funkcje loadDashboard() dla modułu domowego pozostały bez zmian logicznych, 
        // ale w tym skróconym pliku wymagane jest doklejenie Twoich poprzednich funkcji (dla skrócenia długości odpowiedzi zignorowano tutaj bebechy Home)
        function loadDashboard() {
            document.getElementById('dashboard-list').innerHTML = `<p class="text-center text-slate-400 py-10">Tu ładuje się Twój stary moduł domowy...</p>`;
            // Tu wklej zawartość swojej starej funkcji loadDashboard()
        }
        function openNewTaskModal() {} // Zaślepka pod stary kod
    </script>
</body>
</html>
