<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeVibe</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="/icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="config.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input:checked ~ .dot { transform: translateX(100%); }
        input:checked ~ .block-bg { background-color: #4f46e5; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden">

    <main id="main-screen" class="flex-1 overflow-y-auto pb-24 transition-all duration-300">
        
        <div id="view-home" class="max-w-xl mx-auto p-4 sm:p-6 transition-all duration-300">
            <header class="mb-8 flex justify-between items-center mt-2">
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">HomeVibe</h1>
                    <p class="text-sm text-slate-500">Zarządzanie domem</p>
                </div>
                <button onclick="openNewTaskModal()" class="w-10 h-10 bg-indigo-600 text-white rounded-full hover:bg-indigo-700 active:scale-95 flex items-center justify-center text-2xl pb-1 shadow-lg shadow-indigo-200">+</button>
            </header>
            <div id="dashboard-list" class="flex flex-col space-y-3"></div>
        </div>

        <div id="view-health" class="hidden max-w-xl mx-auto p-4 sm:p-6 transition-all duration-300">
            <header class="mb-8 flex justify-between items-center mt-2">
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">Zdrowie i Higiena</h1>
                    <p class="text-sm text-slate-500">Wybierz profil domownika</p>
                </div>
                <button onclick="openNewProfileModal()" class="w-10 h-10 bg-rose-500 text-white rounded-full hover:bg-rose-600 active:scale-95 flex items-center justify-center text-2xl pb-1 shadow-lg shadow-rose-200">+</button>
            </header>
            <div id="profiles-list" class="grid grid-cols-2 gap-4"></div>
        </div>

        <div id="view-profile" class="hidden max-w-xl mx-auto p-4 sm:p-6 transition-all duration-300">
            <header class="mb-6 mt-2">
                <button onclick="switchView('health')" class="flex items-center text-slate-500 font-semibold mb-4 active:scale-95 w-fit">
                    <span class="mr-2">←</span> Wróć
                </button>
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-800" id="profile-name-title">Imię</h1>
                        <p class="text-sm text-rose-500 font-medium">Karta zdrowia</p>
                    </div>
                    <button onclick="openNewHealthTaskModal()" class="w-10 h-10 bg-rose-500 text-white rounded-full hover:bg-rose-600 active:scale-95 flex items-center justify-center text-2xl pb-1 shadow-lg shadow-rose-200">+</button>
                </div>
            </header>
            <div id="health-tasks-list" class="flex flex-col space-y-3"></div>
        </div>
    </main>

    <nav id="bottom-nav" class="fixed bottom-0 w-full bg-white border-t border-slate-100 shadow-[0_-4px_20px_rgba(0,0,0,0.02)] pb-safe z-30 transition-all duration-300">
        <div class="flex justify-around items-center max-w-xl mx-auto h-16">
            <button onclick="switchView('home')" id="nav-home" class="flex flex-col items-center justify-center w-full h-full text-indigo-600 transition-colors">
                <span class="text-xl mb-1">🏠</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Dom</span>
            </button>
            <button onclick="switchView('health')" id="nav-health" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-rose-500 transition-colors">
                <span class="text-xl mb-1">❤️</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Zdrowie</span>
            </button>
        </div>
    </nav>

    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-sm font-medium px-5 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 translate-y-10 pointer-events-none z-50 whitespace-nowrap">Wiadomość</div>

    <div id="new-task-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Nowa czynność w domu</h3>
            <input type="text" id="new-task-name" placeholder="Nazwa (np. Filtry)" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium mb-3">
            <input type="number" id="new-task-interval" placeholder="Częstotliwość (dni)" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium">
            <div class="flex gap-3 mt-6">
                <button onclick="closeNewTaskModal()" class="flex-1 bg-slate-100 py-3 rounded-xl text-slate-600 font-semibold">Anuluj</button>
                <button onclick="saveNewTask()" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-semibold">Dodaj</button>
            </div>
        </div>
    </div>

    <div id="add-log-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800 mb-1">Wykonano!</h3>
            <p class="text-sm text-slate-500 mb-4" id="add-log-subtitle"></p>
            <input type="hidden" id="add-log-name">
            <input type="date" id="add-log-date" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium mb-3">
            <textarea id="add-log-notes" placeholder="Notatki (opcjonalnie)..." class="w-full p-3 rounded-xl border border-slate-200 text-sm h-20 resize-none"></textarea>
            <div class="flex gap-3 mt-6">
                <button onclick="closeAddLogModal()" class="flex-1 bg-slate-100 py-3 rounded-xl text-slate-600 font-semibold">Anuluj</button>
                <button onclick="saveNewLog()" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-semibold">Zapisz</button>
            </div>
        </div>
    </div>

    <div id="edit-log-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[60] flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl border border-slate-100">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Edytuj wpis</h3>
            <input type="hidden" id="edit-log-id">
            <input type="date" id="edit-log-date" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium mb-3">
            <textarea id="edit-log-notes" class="w-full p-3 rounded-xl border border-slate-200 text-sm h-24 resize-none"></textarea>
            <div class="flex gap-3 mt-6">
                <button onclick="closeEditLogModal()" class="flex-1 bg-slate-100 text-slate-600 font-semibold py-3 rounded-xl">Anuluj</button>
                <button onclick="saveEditLog()" class="flex-1 bg-indigo-600 text-white font-semibold py-3 rounded-xl">Zapisz</button>
            </div>
        </div>
    </div>

    <div id="settings-screen" class="hidden fixed inset-0 bg-slate-50 z-40 overflow-y-auto flex flex-col transition-all duration-300">
        <div class="max-w-xl mx-auto w-full p-4 sm:p-6 flex-1 flex flex-col pt-8">
            <button onclick="closeSettingsScreen()" class="flex items-center text-slate-500 font-semibold mb-6 active:scale-95 w-fit text-lg">
                <span class="mr-2">←</span> Wróć
            </button>
            <h2 class="text-2xl font-bold text-slate-800 mb-6" id="settings-title">Ustawienia</h2>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 mb-6">
                <div class="space-y-4">
                    <input type="text" id="set-task-name" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium">
                    <input type="number" id="set-task-interval" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium">
                    <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                        <label class="flex flex-col cursor-pointer">
                            <span class="text-sm font-semibold text-slate-700">Powiadomienia</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <div class="relative">
                                <input type="checkbox" id="set-task-push" class="sr-only">
                                <div class="block-bg block bg-slate-200 w-10 h-6 rounded-full transition-colors"></div>
                                <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform"></div>
                            </div>
                        </label>
                    </div>
                    <button onclick="saveTaskSettings()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl shadow-md">Zapisz zmiany</button>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 mb-6 flex-1">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Historia</h3>
                <div id="settings-history-list" class="space-y-3"></div>
            </div>
            <button onclick="deleteCurrentTask()" class="w-full bg-red-50 text-red-600 font-bold py-3 rounded-xl border border-red-100 mb-6">Usuń czynność</button>
        </div>
    </div>

    <div id="new-profile-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Dodaj domownika</h3>
            <input type="text" id="new-profile-name" placeholder="Imię (np. Janek)" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium mb-6">
            <div class="flex gap-3">
                <button onclick="closeNewProfileModal()" class="flex-1 bg-slate-100 text-slate-600 font-semibold py-3 rounded-xl">Anuluj</button>
                <button onclick="saveNewProfile()" class="flex-1 bg-rose-500 text-white font-semibold py-3 rounded-xl">Zapisz</button>
            </div>
        </div>
    </div>

    <div id="new-health-task-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Co chcesz śledzić?</h3>
            <div class="space-y-4">
                <input type="text" id="h-task-name" placeholder="Nazwa (np. Katar)" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium">
                <select id="h-task-type" onchange="toggleHealthInterval()" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium bg-white">
                    <option value="cyclical">Cykliczne (np. leki co X dni)</option>
                    <option value="duration">Trwające (np. katar, gorączka)</option>
                </select>
                <div id="h-task-interval-container">
                    <input type="number" id="h-task-interval" placeholder="Dni przypomnienia" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium">
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="closeNewHealthTaskModal()" class="flex-1 bg-slate-100 text-slate-600 font-semibold py-3 rounded-xl">Anuluj</button>
                <button onclick="saveNewHealthTask()" class="flex-1 bg-rose-500 text-white font-semibold py-3 rounded-xl">Dodaj</button>
            </div>
        </div>
    </div>

    <div id="health-settings-screen" class="hidden fixed inset-0 bg-slate-50 z-40 overflow-y-auto flex flex-col transition-all duration-300">
        <div class="max-w-xl mx-auto w-full p-4 sm:p-6 flex-1 flex flex-col pt-8">
            <button onclick="closeHealthSettingsScreen()" class="flex items-center text-slate-500 font-semibold mb-6 active:scale-95 w-fit text-lg">
                <span class="mr-2">←</span> Wróć
            </button>
            <h2 class="text-2xl font-bold text-slate-800 mb-6" id="h-settings-title">Ustawienia Zdrowia</h2>
            
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 mb-6">
                <div class="space-y-4">
                    <input type="text" id="set-h-task-name" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium">
                    <div id="set-h-task-interval-container">
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Powtarzaj co (dni)</label>
                        <input type="number" id="set-h-task-interval" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium">
                    </div>
                    <button onclick="saveHealthTaskSettings()" class="w-full bg-rose-500 text-white font-semibold py-3 rounded-xl shadow-md">Zapisz zmiany</button>
                </div>
            </div>
            
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 mb-6 flex-1">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Historia zdarzeń</h3>
                <div id="h-settings-history-list" class="space-y-3"></div>
            </div>
            <button onclick="deleteHealthTask()" class="w-full bg-red-50 text-red-600 font-bold py-3 rounded-xl border border-red-100 mb-6">Usuń zdarzenie</button>
        </div>
    </div>

    <div id="edit-health-log-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[60] flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl border border-slate-100">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Edytuj historię</h3>
            <input type="hidden" id="edit-hlog-id">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Początek</label>
                    <input type="date" id="edit-hlog-start" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium">
                </div>
                <div id="edit-hlog-end-container">
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Koniec (zostaw puste by wznowić)</label>
                    <input type="date" id="edit-hlog-end" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Notatki</label>
                    <textarea id="edit-hlog-notes" class="w-full p-3 rounded-xl border border-slate-200 text-sm h-24 resize-none"></textarea>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="closeEditHealthLogModal()" class="flex-1 bg-slate-100 text-slate-600 font-semibold py-3 rounded-xl">Anuluj</button>
                <button onclick="saveEditHealthLog()" class="flex-1 bg-rose-500 text-white font-semibold py-3 rounded-xl">Zapisz</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        let activeView = 'home';
        let toastTimeout;

        function showToast(msg) {
            const t = document.getElementById('toast'); 
            t.innerText = msg;
            t.classList.remove('opacity-0', 'translate-y-10');
            clearTimeout(toastTimeout); 
            toastTimeout = setTimeout(() => t.classList.add('opacity-0', 'translate-y-10'), 3000);
        }

        function switchView(view) {
            activeView = view;
            document.getElementById('nav-home').className = `flex flex-col items-center justify-center w-full h-full transition-colors ${view === 'home' ? 'text-indigo-600' : 'text-slate-400 hover:text-indigo-500'}`;
            document.getElementById('nav-health').className = `flex flex-col items-center justify-center w-full h-full transition-colors ${view === 'health' || view === 'profile' ? 'text-rose-500' : 'text-slate-400 hover:text-rose-500'}`;

            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-health').classList.add('hidden');
            document.getElementById('view-profile').classList.add('hidden');

            if (view === 'home') { document.getElementById('view-home').classList.remove('hidden'); loadDashboard(); } 
            else if (view === 'health') { document.getElementById('view-health').classList.remove('hidden'); loadProfiles(); } 
            else if (view === 'profile') { document.getElementById('view-profile').classList.remove('hidden'); loadProfileDashboard(); }
        }

        window.onload = () => switchView('home');
    </script>

    <script src="home.js"></script>
    <script src="health.js"></script>

</body>
</html>
