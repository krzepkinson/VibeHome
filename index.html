<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeVibe</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="/icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="config.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input:checked ~ .dot { transform: translateX(100%); }
        input:checked ~ .block-bg { background-color: #4f46e5; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden">

    <main id="main-screen" class="flex-1 overflow-y-auto pb-24 transition-all duration-300">
        
        <div id="view-home" class="max-w-xl mx-auto p-4 sm:p-6 transition-all duration-300">
            <header class="mb-8 flex justify-between items-center mt-2">
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">HomeVibe</h1>
                    <p class="text-sm text-slate-500">Zarządzanie domem</p>
                </div>
                <button onclick="openNewTaskModal()" class="w-10 h-10 bg-indigo-600 text-white rounded-full hover:bg-indigo-700 active:scale-95 flex items-center justify-center text-2xl pb-1 shadow-lg shadow-indigo-200">+</button>
            </header>
            <div id="dashboard-list" class="flex flex-col space-y-3"></div>
        </div>

        <div id="view-health" class="hidden max-w-xl mx-auto p-4 sm:p-6 transition-all duration-300">
            <header class="mb-8 flex justify-between items-center mt-2">
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">Zdrowie i Higiena</h1>
                    <p class="text-sm text-slate-500">Wybierz profil domownika</p>
                </div>
                <button onclick="openNewProfileModal()" class="w-10 h-10 bg-rose-500 text-white rounded-full hover:bg-rose-600 active:scale-95 flex items-center justify-center text-2xl pb-1 shadow-lg shadow-rose-200">+</button>
            </header>
            <div id="profiles-list" class="grid grid-cols-2 gap-4"></div>
        </div>

        <div id="view-profile" class="hidden max-w-xl mx-auto p-4 sm:p-6 transition-all duration-300">
            <header class="mb-6 mt-2">
                <button onclick="switchView('health')" class="flex items-center text-slate-500 font-semibold mb-4 active:scale-95 w-fit">
                    <span class="mr-2">←</span> Wróć
                </button>
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-800" id="profile-name-title">Imię</h1>
                        <p class="text-sm text-rose-500 font-medium">Karta zdrowia</p>
                    </div>
                    <button onclick="openNewHealthTaskModal()" class="w-10 h-10 bg-rose-500 text-white rounded-full hover:bg-rose-600 active:scale-95 flex items-center justify-center text-2xl pb-1 shadow-lg shadow-rose-200">+</button>
                </div>
            </header>
            
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 mb-8">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeCalendarMonth(-1)" class="w-8 h-8 flex justify-center items-center rounded-full bg-slate-50 text-slate-400 hover:text-rose-500 font-bold active:scale-90">&lt;</button>
                    <h3 class="font-bold text-slate-800 uppercase tracking-wide text-sm" id="calendar-month-year">Miesiąc Rok</h3>
                    <button onclick="changeCalendarMonth(1)" class="w-8 h-8 flex justify-center items-center rounded-full bg-slate-50 text-slate-400 hover:text-rose-500 font-bold active:scale-90">&gt;</button>
                </div>
                <div class="grid grid-cols-7 text-center text-[10px] font-bold text-slate-400 uppercase mb-2">
                    <div>Pn</div><div>Wt</div><div>Śr</div><div>Cz</div><div>Pt</div><div>Sb</div><div>Nd</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1">
                    </div>
            </div>

            <div id="health-tasks-list" class="flex flex-col space-y-3"></div>
        </div>
    </main>

    <nav id="bottom-nav" class="fixed bottom-0 w-full bg-white border-t border-slate-100 shadow-[0_-4px_20px_rgba(0,0,0,0.02)] pb-safe z-30 transition-all duration-300">
        <div class="flex justify-around items-center max-w-xl mx-auto h-16">
            <button onclick="switchView('home')" id="nav-home" class="flex flex-col items-center justify-center w-full h-full text-indigo-600 transition-colors">
                <span class="text-xl mb-1">🏠</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Dom</span>
            </button>
            <button onclick="switchView('health')" id="nav-health" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-rose-500 transition-colors">
                <span class="text-xl mb-1">❤️</span>
                <span class="text-[10px] font-bold uppercase tracking-wider">Zdrowie</span>
            </button>
        </div>
    </nav>

    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-sm font-medium px-5 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 translate-y-10 pointer-events-none z-50 whitespace-nowrap">Wiadomość</div>

    <div id="new-task-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Nowa czynność w domu</h3>
            <input type="text" id="new-task-name" placeholder="Nazwa (np. Filtry)" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium mb-3">
            <input type="number" id="new-task-interval" placeholder="Częstotliwość (dni)" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium">
            <div class="flex gap-3 mt-6">
                <button onclick="closeNewTaskModal()" class="flex-1 bg-slate-100 py-3 rounded-xl text-slate-600 font-semibold">Anuluj</button>
                <button onclick="saveNewTask()" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-semibold">Dodaj</button>
            </div>
        </div>
    </div>

    <div id="add-log-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800 mb-1">Wykonano!</h3>
            <p class="text-sm text-slate-500 mb-4" id="add-log-subtitle"></p>
            <input type="hidden" id="add-log-name">
            <input type="date" id="add-log-date" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium mb-3">
            <textarea id="add-log-notes" placeholder="Notatki (opcjonalnie)..." class="w-full p-3 rounded-xl border border-slate-200 text-sm h-20 resize-none"></textarea>
            <div class="flex gap-3 mt-6">
                <button onclick="closeAddLogModal()" class="flex-1 bg-slate-100 py-3 rounded-xl text-slate-600 font-semibold">Anuluj</button>
                <button onclick="saveNewLog()" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-semibold">Zapisz</button>
            </div>
