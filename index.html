<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeVibe</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#131314">
    <link rel="apple-touch-icon" href="/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap');
        body { font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #131314; color: #e3e3e3; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #444746; border-radius: 10px; }
        input:checked ~ .dot { transform: translateX(100%); }
        input:checked ~ .block-bg { background-color: #a8c7fa; }
        input:checked ~ .dot { background-color: #004a77; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header id="global-nav-header" class="hidden px-4 py-3 flex items-center bg-[#131314] sticky top-0 z-40 border-b border-[#333537]">
        <button onclick="goBack()" class="flex items-center text-neutral-300 font-medium active:scale-95 w-fit"><span class="mr-2 text-xl">←</span> Wróć</button>
    </header>

    <main id="main-screen" class="flex-1 overflow-y-auto pb-24 transition-all duration-300">
        <div id="view-auth" class="hidden fixed inset-0 z-[100] bg-[#131314] flex flex-col justify-center items-center p-6 screen-view transition-all duration-300">
            <div class="w-full max-w-sm">
                <div class="text-center mb-10"><div class="text-6xl mb-4">✨</div><h1 id="auth-title" class="text-2xl font-medium text-neutral-100 tracking-wide mb-2">Witaj</h1><p id="auth-subtitle" class="text-sm text-neutral-400">Zaloguj się do HomeVibe</p></div>
                <div class="space-y-4 mb-6">
                    <input type="email" id="auth-email" placeholder="Email" class="w-full p-4 rounded-[20px] bg-[#1e1f20] border border-[#333537] text-neutral-200 text-sm focus:outline-none">
                    <input type="password" id="auth-password" placeholder="Hasło" class="w-full p-4 rounded-[20px] bg-[#1e1f20] border border-[#333537] text-neutral-200 text-sm focus:outline-none">
                </div>
                <button id="auth-action-btn" onclick="handleAuthAction()" class="w-full bg-[#a8c7fa] text-[#004a77] font-bold py-4 rounded-full text-sm mb-6 active:scale-95 transition-transform">Zaloguj się</button>
                <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="w-full text-center text-sm text-neutral-400">Nie masz konta? <span class="text-[#a8c7fa]">Zarejestruj się</span></button>
            </div>
        </div>

        <div id="view-dashboard" class="hidden max-w-xl mx-auto p-4 sm:p-6 screen-view">
            <header class="mb-4 mt-2 flex justify-between items-start">
                <div><h1 class="text-2xl font-medium text-neutral-100 tracking-wide">Dzień dobry!</h1><p class="text-xs text-neutral-400 mb-5">Twój dom w pigułce</p></div>
                <button onclick="refreshCurrentView()" class="w-10 h-10 rounded-full bg-[#1e1f20] border border-[#333537] text-neutral-400 flex items-center justify-center text-xl">↻</button>
            </header>
            <div class="flex p-1 bg-[#1e1f20] rounded-2xl mb-6 border border-[#333537] overflow-x-auto hide-scrollbar">
                <button onclick="switchDashboardTab('todo')" id="tab-todo" class="flex-1 py-2.5 px-4 text-[10px] font-bold uppercase rounded-xl transition-all">📝 Zadania</button>
                <button onclick="switchDashboardTab('home')" id="tab-home" class="flex-1 py-2.5 px-4 text-[10px] font-bold uppercase rounded-xl transition-all">🏠 Dom</button>
                <button onclick="switchDashboardTab('health')" id="tab-health" class="flex-1 py-2.5 px-4 text-[10px] font-bold uppercase rounded-xl transition-all">❤️ Zdrowie</button>
                <button onclick="switchDashboardTab('history')" id="tab-history" class="flex-1 py-2.5 px-4 text-[10px] font-bold uppercase rounded-xl transition-all">🕒 Historia</button>
            </div>
            <div id="dashboard-overview-list" class="flex flex-col space-y-3"></div>
        </div>

        <div id="view-home" class="hidden max-w-xl mx-auto p-4 sm:p-6 screen-view">
            <header class="mb-6 flex justify-between items-center mt-2">
                <div class="flex items-center gap-3"><button id="home-back-btn" onclick="goBack()" class="hidden w-8 h-8 rounded-full bg-[#333537] flex items-center justify-center">←</button><div><h1 class="text-xl font-medium">Dom</h1><p class="text-xs text-neutral-400">Pomieszczenia</p></div></div>
                <div class="flex gap-2"><button onclick="refreshCurrentView()" class="w-10 h-10 rounded-full bg-[#1e1f20] border border-[#333537] text-neutral-400 flex items-center justify-center text-xl">↻</button><button onclick="openNewTaskModal()" class="w-10 h-10 bg-[#004a77] text-[#c2e7ff] rounded-full text-xl">+</button></div>
            </header>
            <div id="dashboard-list"></div>
        </div>

        <div id="view-todo" class="hidden max-w-xl mx-auto p-4 sm:p-6 screen-view">
            <header class="mb-6 flex justify-between items-center mt-2">
                <div><h1 class="text-xl font-medium">Zadania i Listy</h1><p class="text-xs text-neutral-400">Do zrobienia</p></div>
                <div class="flex gap-2"><button onclick="refreshCurrentView()" class="w-10 h-10 rounded-full bg-[#1e1f20] border border-[#333537] text-neutral-400 flex items-center justify-center text-xl">↻</button><button onclick="openNewListModal()" class="px-3 h-10 bg-[#004a77]/20 text-[#c2e7ff] text-[10px] font-bold rounded-full border border-[#004a77]/50">+ Lista</button><button onclick="openNewTodoModal()" class="w-10 h-10 bg-[#e3e3e3] text-[#131314] rounded-full text-xl">+</button></div>
            </header>
            <div id="todo-list"></div>
        </div>

        <div id="view-profile" class="hidden max-w-xl mx-auto p-4 sm:p-6 screen-view">
            <header class="mb-6 mt-2 flex justify-between items-center">
                <div><h1 id="profile-name-title" class="text-xl font-medium">Ładowanie...</h1><p class="text-xs text-[#ffb4ab]">Karta zdrowia</p></div>
                <div class="flex gap-2"><button onclick="refreshCurrentView()" class="w-10 h-10 rounded-full bg-[#1e1f20] border border-[#333537] text-neutral-400 flex items-center justify-center text-xl">↻</button><button onclick="openNewHealthTaskModal()" class="w-10 h-10 bg-[#8c1d18] text-[#ffdad6] rounded-full text-xl">+</button><button onclick="toggleProfileSwitcher()" id="health-header-avatar" class="w-10 h-10 rounded-full bg-[#444746] text-white flex items-center justify-center">?</button></div>
            </header>
            <div id="calendar-container" class="bg-[#1e1f20] p-4 rounded-[28px] border border-[#333537] mb-6"></div>
            <div id="health-tasks-list"></div>
        </div>

        <div id="view-settings-main" class="hidden max-w-xl mx-auto p-4 sm:p-6 screen-view">
            <header class="mb-6 mt-2"><div><h1 class="text-xl font-medium">Ustawienia</h1><p class="text-xs text-neutral-400">Konfiguracja</p></div></header>
            <div class="bg-[#1e1f20] rounded-[28px] border border-[#333537] mb-6 overflow-hidden">
                <div class="p-5 border-b border-[#333537] bg-[#333537]/20 flex items-center gap-3">
                    <div class="flex-1"><label class="block text-[10px] text-neutral-400 mb-1 uppercase font-bold">Twoje Imię</label><input type="text" id="settings-user-name" class="w-full p-2.5 rounded-[12px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none"></div>
                    <button onclick="saveUserName()" class="mt-4 px-4 py-2 bg-[#a8c7fa] text-[#004a77] text-xs font-bold rounded-[12px]">Zapisz</button>
                </div>
                <div class="p-5 border-b border-[#333537] flex justify-between items-center"><div><h3 class="text-sm font-medium">Dom Rodzinny</h3><p class="text-[9px] text-neutral-500 break-all" id="household-id-label"></p></div><button onclick="joinHousehold()" class="px-3 py-1.5 bg-[#333537] rounded-full text-[10px] font-bold">Dołącz</button></div>
                <div onclick="openRoomsSettings()" class="p-5 border-b border-[#333537] flex justify-between items-center cursor-pointer"><span>Pomieszczenia</span><span>→</span></div>
                <div onclick="openProfilesSettings()" class="p-5 border-b border-[#333537] flex justify-between items-center cursor-pointer"><span>Domownicy</span><span>→</span></div>
                <div onclick="window.openArchiveScreen()" class="p-5 flex justify-between items-center cursor-pointer"><span>🗃️ Archiwum</span><span>→</span></div>
            </div>
            <button onclick="logoutUser()" class="w-full bg-[#3c1414] text-[#ffb4ab] py-4 rounded-[24px] border border-[#8c1d18]/30 font-medium">🚪 Wyloguj się</button>
        </div>
    </main>

    <nav id="bottom-nav" class="fixed bottom-0 w-full bg-[#1e1f20] border-t border-[#333537] h-16 flex justify-around items-center z-30">
        <button onclick="switchView('dashboard')" id="nav-dashboard" class="flex-1 flex flex-col items-center"><span>✨</span><span class="text-[9px] uppercase">Przegląd</span></button>
        <button onclick="switchView('home')" id="nav-home" class="flex-1 flex flex-col items-center"><span>🏠</span><span class="text-[9px] uppercase">Dom</span></button>
        <button onclick="switchView('todo')" id="nav-todo" class="flex-1 flex flex-col items-center"><span>📝</span><span class="text-[9px] uppercase">Zadania</span></button>
        <button onclick="switchView('health')" id="nav-health" class="flex-1 flex flex-col items-center"><span>❤️</span><span class="text-[9px] uppercase">Zdrowie</span></button>
        <button onclick="switchView('settings')" id="nav-settings" class="flex-1 flex flex-col items-center"><span>⚙️</span><span class="text-[9px] uppercase">Opcje</span></button>
    </nav>

    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-white text-[#131314] text-xs font-medium px-5 py-2 rounded-full opacity-0 translate-y-10 transition-all z-50"></div>

    <div id="change-user-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[80] flex justify-center items-center p-4">
        <div class="bg-[#131314] rounded-[28px] border border-[#333537] w-full max-w-sm p-6 shadow-2xl">
            <h3 class="text-base font-medium mb-4">Kto to zrobił?</h3>
            <input type="hidden" id="change-user-type"><input type="hidden" id="change-user-id">
            <div id="change-user-list" class="max-h-48 overflow-y-auto mb-4 hide-scrollbar"></div>
            <div class="flex gap-2">
                <input type="text" id="change-user-custom" placeholder="Inne imię..." class="flex-1 p-3.5 rounded-[20px] bg-[#1e1f20] border border-[#333537] text-sm focus:outline-none">
                <button onclick="window.saveChangedUser('')" class="px-5 bg-[#004a77] text-[#c2e7ff] rounded-[20px] text-sm font-bold">Zapisz</button>
            </div>
            <button onclick="closeChangeUserModal()" class="w-full mt-4 text-neutral-500 text-xs uppercase font-bold">Anuluj</button>
        </div>
    </div>

    <div id="edit-todo-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex justify-center items-center p-4"><div class="bg-[#1e1f20] rounded-[28px] border border-[#333537] w-full max-w-sm p-6 shadow-2xl"><h3 class="text-base font-medium mb-4">Edycja Zadania</h3><input type="hidden" id="edit-todo-id"><input type="text" id="edit-todo-title" class="w-full p-4 rounded-[20px] bg-[#131314] border border-[#333537] text-sm focus:outline-none mb-6"><div class="flex gap-3"><button onclick="closeEditTodoModal()" class="flex-1 text-neutral-300 py-3 rounded-full hover:bg-[#333537]">Anuluj</button><button onclick="saveEditedTodo()" class="flex-1 bg-[#a8c7fa] text-[#004a77] font-bold py-3 rounded-full">Zapisz</button></div></div></div>
    
    <div id="checklist-screen" class="hidden fixed inset-0 bg-[#131314] z-50 overflow-y-auto p-4 flex flex-col"><div class="max-w-xl mx-auto w-full pt-8 flex-1 flex flex-col"><div class="flex justify-between items-center mb-6"><button onclick="closeChecklistScreen()" class="text-neutral-400 font-medium">← Wróć</button><button onclick="refreshCurrentView()" class="w-8 h-8 rounded-full bg-[#1e1f20] border border-[#333537] text-neutral-400">↻</button></div><h2 class="text-xl font-medium mb-6" id="checklist-screen-title"></h2><div class="flex gap-2 mb-6"><input type="text" id="new-checklist-item-input" placeholder="Dopisz..." class="flex-1 p-3.5 rounded-[20px] bg-[#1e1f20] border border-[#333537] text-sm focus:outline-none"><button onclick="saveChecklistItem()" class="px-5 bg-[#004a77] text-[#c2e7ff] rounded-[20px] font-bold">Dodaj</button></div><div id="checklist-items-list" class="flex flex-col"></div></div></div>

    <script src="/utils.js"></script>
    <script src="/auth.js"></script>
    <script src="/router.js"></script>
    <script src="/dashboard.js"></script>
    <script src="/home.js"></script>
    <script src="/health.js"></script>
    <script src="/todo.js"></script>
    <script src="/settings.js"></script>
    <script src="/search.js"></script>
</body>
</html>
