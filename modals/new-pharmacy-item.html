<div id="new-pharmacy-item-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] flex justify-center items-center p-4">
    <div class="bg-[#1e1f20] rounded-[28px] border border-[#333537] w-full max-w-sm p-6 shadow-2xl">
        <h3 class="text-base font-medium text-neutral-100 mb-4 tracking-wide">Dodaj do apteczki</h3>
        <div class="space-y-3">
            <input type="text" id="pharmacy-item-name" maxlength="100" placeholder="Nazwa leku (np. Ibum Forte)" class="w-full p-3 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none focus:border-[#a8c7fa]">
            <div>
                <label class="block text-[10px] uppercase tracking-wider text-neutral-500 mb-1 pl-1">Data ważności (Miesiąc / Rok)</label>
                <input type="month" id="pharmacy-item-exp" class="w-full p-3 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none [color-scheme:dark]">
            </div>
            <input type="text" id="pharmacy-item-purpose" maxlength="150" placeholder="Na co to jest? (opcjonalnie)" class="w-full p-3 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none focus:border-[#a8c7fa]">
        </div>
        <div class="flex gap-3 mt-6">
            <button class="js-close-new-pharmacy-item flex-1 text-neutral-300 font-medium py-3 text-sm rounded-full hover:bg-[#333537] transition-colors">Anuluj</button>
            <button class="js-save-new-pharmacy-item flex-1 bg-[#a8c7fa] text-[#004a77] font-medium py-3 text-sm rounded-full active:scale-95 transition-transform">Zapisz</button>
        </div>
    </div>
</div>
