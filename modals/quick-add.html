<div id="quick-add-modal" class="ux-modal hidden" role="dialog" aria-modal="true" aria-labelledby="quick-add-title">
    <section class="ux-sheet">
        <header class="ux-header">
            <h2 id="quick-add-title" class="ux-title">Dodaj</h2>
            <button type="button" class="ux-icon-btn js-close-quick-add" aria-label="Zamknij"><span data-icon="close"></span></button>
        </header>
        <form id="quick-add-form" class="ux-form">
            <div id="quick-add-body"></div>
            <p id="quick-add-error" class="ux-error" role="alert"></p>
            <div id="quick-add-actions" class="ux-actions">
                <button type="button" class="ux-btn ghost js-close-quick-add">Anuluj</button>
                <button id="quick-add-save" type="submit" class="ux-btn primary">Zapisz</button>
            </div>
        </form>
    </section>
</div>
