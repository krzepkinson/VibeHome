<div id="new-checklist-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] flex justify-center items-center p-4">
    <div class="bg-[#1e1f20] rounded-[28px] border border-[#333537] w-full max-w-sm p-6 shadow-2xl">
        <h3 class="text-base font-medium text-neutral-100 mb-4 tracking-wide">Nowa Lista</h3>
        
        <div class="space-y-3">
            <input type="text" id="new-checklist-title" placeholder="Nazwa (np. Weekend w Rzymie)" class="w-full p-3 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none focus:border-[#a8c7fa]">
            
            <select id="new-checklist-type" onchange="window.toggleChecklistDates()" class="w-full p-3 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none appearance-none">
                <option value="generic">🗂️ Zwykła lista (To-Do)</option>
                <option value="shopping">🛒 Lista zakupów</option>
                <option value="packing">🧳 Do spakowania (Wyjazd)</option>
            </select>

            <div id="checklist-dates-container" class="hidden flex gap-2">
                <div class="flex-1">
                    <label class="block text-[10px] uppercase tracking-wider text-neutral-500 mb-1 pl-1">Wyjazd</label>
                    <input type="date" id="new-checklist-start" class="w-full p-3 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none [color-scheme:dark]">
                </div>
                <div class="flex-1">
                    <label class="block text-[10px] uppercase tracking-wider text-neutral-500 mb-1 pl-1">Powrót</label>
                    <input type="date" id="new-checklist-end" class="w-full p-3 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none [color-scheme:dark]">
                </div>
            </div>
        </div>
        
        <div class="flex gap-3 mt-6">
            <button onclick="window.closeNewChecklistModal()" class="flex-1 text-neutral-300 font-medium py-3 text-sm rounded-full hover:bg-[#333537] transition-colors">Anuluj</button>
            <button onclick="window.saveNewChecklist()" class="flex-1 bg-[#a8c7fa] text-[#004a77] font-medium py-3 text-sm rounded-full active:scale-95 transition-transform">Utwórz</button>
        </div>

    </div>
</div>
