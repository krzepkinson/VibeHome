<div id="new-checklist-modal" class="ux-modal hidden" role="dialog" aria-modal="true" aria-labelledby="new-checklist-heading">
 <section class="ux-sheet">
  <header class="ux-header"><h2 id="new-checklist-heading" class="ux-title">Utwórz listę</h2><button type="button" class="ux-icon-btn" onclick="window.closeNewChecklistModal()" aria-label="Zamknij"><span data-icon="close"></span></button></header>
  <form id="new-checklist-form" onsubmit="event.preventDefault();window.saveNewChecklist()">
   <label class="ux-field" for="new-checklist-title">Nazwa listy</label><input type="text" id="new-checklist-title" maxlength="150" placeholder="Np. Weekend nad morzem" class="ux-input" required>
   <label class="ux-field" for="new-checklist-type">Rodzaj listy</label><select id="new-checklist-type" onchange="window.toggleChecklistDates()" class="ux-input"><option value="generic">Zwykła lista</option><option value="shopping">Zakupy</option><option value="packing">Do spakowania</option></select>
   <div id="checklist-dates-container" class="ux-grid-2 ux-section hidden"><label class="ux-field">Wyjazd<input type="date" id="new-checklist-start" class="ux-input"></label><label class="ux-field">Powrót<input type="date" id="new-checklist-end" class="ux-input"></label></div>
   <div class="ux-actions"><button type="button" class="ux-btn ghost" onclick="window.closeNewChecklistModal()">Anuluj</button><button type="submit" class="ux-btn primary">Utwórz</button></div>
  </form>
 </section>
</div>
