<div id="new-task-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex justify-center items-center p-4">
    <div class="bg-[#1e1f20] rounded-[28px] border border-[#333537] w-full max-w-sm p-6 shadow-2xl">
        <h3 class="text-base font-medium text-neutral-100 mb-4 tracking-wide">Nowa czynność w domu</h3>
        <input type="text" id="new-task-name" maxlength="100" placeholder="Nazwa" class="w-full p-3 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm mb-3 focus:outline-none">
        <select id="new-task-room" class="w-full p-3 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm mb-3 focus:outline-none"></select>
        <div class="flex gap-2 mb-3">
            <div class="flex-1">
                <label class="block text-[10px] text-neutral-500 mb-1 pl-1">Co ile dni?</label>
                <input type="number" id="new-task-interval" class="w-full p-3 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none">
            </div>
            <div class="flex-1">
                <label class="block text-[10px] text-neutral-500 mb-1 pl-1">Przypomnij dni przed</label>
                <input type="number" id="new-task-remind" value="0" class="w-full p-3 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none">
            </div>
        </div>
        <div class="flex gap-3 mt-6">
            <button onclick="window.closeNewTaskModal()" class="flex-1 text-neutral-300 font-medium py-3 text-sm rounded-full hover:bg-[#333537] transition-colors">Anuluj</button>
            <button onclick="window.saveNewTask()" class="flex-1 bg-[#004a77] text-[#c2e7ff] font-medium py-3 text-sm rounded-full active:scale-95 transition-transform">Dodaj</button>
        </div>
    </div>
</div>
