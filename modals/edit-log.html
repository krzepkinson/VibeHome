<div id="edit-log-modal" class="ux-modal hidden" role="dialog" aria-modal="true" aria-labelledby="edit-log-title">
    <section class="ux-sheet">
        <header class="ux-header"><h2 id="edit-log-title" class="ux-title">Zmień zapis wykonania</h2><button type="button" class="ux-icon-btn js-close-edit-log" aria-label="Zamknij"><span data-icon="close"></span></button></header>
        <form id="edit-log-form" onsubmit="event.preventDefault();window.saveEditLog()">
        <input type="hidden" id="edit-log-id">
        <label class="ux-field" for="edit-log-date">Data i godzina wykonania</label><input type="datetime-local" id="edit-log-date" class="ux-input" required>
        <label class="ux-field" for="edit-log-notes">Notatka (opcjonalnie)</label><textarea id="edit-log-notes" maxlength="4000" class="ux-input" rows="3"></textarea>
        <p id="edit-log-error" class="ux-error" role="alert"></p>
        <div class="ux-actions"><button type="button" class="ux-btn ghost js-close-edit-log">Anuluj</button><button type="submit" class="ux-btn primary">Zapisz</button></div>
        </form>
    </section>
</div>
