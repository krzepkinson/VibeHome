<div id="edit-health-log-modal" class="ux-modal hidden" role="dialog" aria-modal="true" aria-labelledby="edit-health-log-heading">
 <section class="ux-sheet">
  <header class="ux-header"><h2 id="edit-health-log-heading" class="ux-title">Zmień daty wpisu</h2><button type="button" class="ux-icon-btn js-close-edit-hlog" aria-label="Zamknij"><span data-icon="close"></span></button></header>
  <form onsubmit="event.preventDefault();window.saveEditHealthLog()">
   <input type="hidden" id="edit-hlog-id">
   <label class="ux-field" for="edit-hlog-start">Początek — data i godzina</label><input type="datetime-local" id="edit-hlog-start" class="ux-input" required>
   <div id="edit-hlog-end-container" class="hidden"><label class="ux-field" for="edit-hlog-end">Koniec — data i godzina</label><input type="datetime-local" id="edit-hlog-end" class="ux-input"><p class="ux-hint">Zostaw puste, jeśli epizod nadal trwa.</p></div>
   <div class="ux-actions"><button type="button" class="ux-btn ghost js-close-edit-hlog">Anuluj</button><button type="submit" class="ux-btn primary">Zapisz</button></div>
  </form>
 </section>
</div>
