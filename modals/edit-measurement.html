<div id="edit-measurement-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[80] flex justify-center items-center p-4">
    <div class="bg-[#1e1f20] rounded-[28px] border border-[#333537] w-full max-w-sm p-6 shadow-2xl">
        <h3 class="text-base font-medium text-neutral-100 mb-4 tracking-wide">Edytuj pomiar</h3>
        <input type="hidden" id="edit-meas-id">
        <div class="space-y-3">
            <div class="flex gap-2">
                <div class="flex-1 w-1/3">
                    <label class="block text-[10px] uppercase tracking-widest text-neutral-500 mb-1.5 font-bold pl-1">Wartość</label>
                    <input type="text" id="edit-meas-value" class="w-full p-3.5 rounded-[16px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none">
                </div>
                <div class="flex-1 w-2/3">
                    <label class="block text-[10px] uppercase tracking-widest text-neutral-500 mb-1.5 font-bold pl-1">Data</label>
                    <input type="datetime-local" id="edit-meas-date" class="w-full p-3.5 rounded-[16px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none [color-scheme:dark]">
                </div>
            </div>
            <div>
                <label class="block text-[10px] uppercase tracking-widest text-neutral-500 mb-1.5 font-bold pl-1">Notatka</label>
                <input type="text" id="edit-meas-notes" class="w-full p-3.5 rounded-[16px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none">
            </div>
        </div>
        <div class="flex gap-3 mt-6">
            <button class="js-close-edit-measurement flex-1 text-neutral-300 font-medium py-3 text-sm rounded-full hover:bg-[#333537] transition-colors">Anuluj</button>
            <button class="js-save-edit-measurement flex-1 bg-[#a8c7fa] text-[#004a77] font-medium py-3 text-sm rounded-full active:scale-95 transition-transform">Zapisz</button>
        </div>
    </div>
</div>
