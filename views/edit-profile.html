<div class="ux-page">
  <header class="ux-header"><button type="button" class="ux-icon-btn" onclick="window.goBack()" aria-label="Wróć"><span data-icon="back"></span></button><h1 class="ux-title" id="edit-profile-title" style="flex:1">Profil osoby</h1></header>
  <input type="hidden" id="edit-profile-id">
  <label class="ux-field" for="edit-profile-name">Imię</label><input id="edit-profile-name" maxlength="50" class="ux-input">
  <label class="ux-field" for="edit-profile-birth">Data urodzenia (opcjonalnie)</label><input id="edit-profile-birth" type="date" class="ux-input">
  <div class="ux-grid-2 ux-section"><div><label class="ux-field" for="edit-profile-height">Wzrost (cm, opcjonalnie)</label><input id="edit-profile-height" type="number" min="0" step="0.1" class="ux-input"></div><div><label class="ux-field" for="edit-profile-weight">Waga (kg, opcjonalnie)</label><input id="edit-profile-weight" type="number" min="0" step="0.1" class="ux-input"></div></div>
  <div class="ux-actions"><button type="button" class="ux-btn ux-danger" onclick="window.deleteProfile()">Usuń profil</button><button type="button" class="ux-btn primary" onclick="window.saveProfileDetails()">Zapisz zmiany</button></div>
</div>
