<div class="fixed inset-0 z-[60] bg-[#131314] flex flex-col transition-all duration-300 animate-fade-in">
    <div class="p-4 sm:p-6 border-b border-[#333537] flex items-center gap-3 bg-[#1e1f20]">
        <button onclick="window.goBack()" class="text-neutral-400 text-2xl active:scale-90 transition-transform pb-1 px-2">←</button>
        <div class="flex-1">
            <h1 class="text-lg font-medium text-neutral-100">Edytuj Profil</h1>
            <p class="text-[10px] text-neutral-500 uppercase tracking-widest" id="edit-profile-subtitle">Personalizacja</p>
        </div>
    </div>
    <div class="p-6 flex-1 overflow-y-auto no-scrollbar">
        <input type="hidden" id="edit-profile-id">
        <div class="mb-6">
            <label class="block text-[10px] text-neutral-500 mb-2 uppercase tracking-widest pl-1 font-bold">Imię domownika</label>
            <input type="text" id="edit-profile-name" maxlength="50" class="w-full p-4 rounded-[20px] bg-[#1e1f20] border border-[#333537] text-neutral-200 text-sm focus:outline-none focus:border-[#a8c7fa]">
        </div>
        <div class="mb-8">
            <label class="block text-[10px] text-neutral-500 mb-2 uppercase tracking-widest pl-1 font-bold">Ikona / Emoji</label>
            <input type="text" id="edit-profile-icon" maxlength="2" class="w-full p-4 rounded-[20px] bg-[#1e1f20] border border-[#333537] text-neutral-200 text-sm focus:outline-none focus:border-[#a8c7fa] text-center text-2xl">
        </div>
        <div class="flex gap-4">
            <button onclick="window.deleteProfile()" class="flex-1 py-4 rounded-[24px] bg-[#3c1414] text-[#ffb4ab] text-sm font-medium border border-[#8c1d18]/30 active:scale-95 transition-transform">Usuń profil</button>
            <button onclick="window.saveEditedProfile()" class="flex-1 py-4 rounded-[24px] bg-[#a8c7fa] text-[#004a77] text-sm font-bold active:scale-95 transition-transform shadow-lg">Zapisz zmiany</button>
        </div>
    </div>
</div>
