<div class="fixed inset-0 z-[60] flex flex-col" style="background:var(--ux-bg)">
 <header class="ux-header" style="padding:16px;margin:0;border-bottom:1px solid var(--ux-line)"><button type="button" class="ux-icon-btn" onclick="window.goBack()" aria-label="Wróć"><span data-icon="back"></span></button><h1 class="ux-title" id="checklist-screen-title" style="flex:1">Lista</h1><button type="button" class="ux-btn primary js-open-quick-add" data-type="list-item"><span data-icon="plus"></span>Dodaj</button></header>
 <div class="ux-toolbar" style="padding:8px 16px;justify-content:flex-start"><button type="button" id="checklist-clear-btn" class="ux-btn ghost small hidden" onclick="window.clearCompletedItems()">Usuń ukończone</button></div>
 <div class="flex-1 min-h-0 overflow-y-auto" style="padding:0 16px 20px"><div id="checklist-items-list"></div></div>
 <div style="padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ux-line);background:var(--ux-panel)"><form id="checklist-inline-form" style="display:flex;gap:8px" onsubmit="event.preventDefault();window.saveChecklistItem()"><label class="sr-only" for="new-checklist-item-input">Nowa pozycja listy</label><input id="new-checklist-item-input" class="ux-input" style="flex:1" placeholder="Dodaj pozycję…" autocomplete="off"><button type="submit" class="ux-icon-btn" aria-label="Dodaj do listy"><span data-icon="plus"></span></button></form></div>
</div>
