<div class="max-w-xl mx-auto p-4 sm:p-6 pb-24 relative min-h-[90vh] animate-fade-in">
    
    <header class="mb-4 mt-2 flex justify-between items-center">
        <div>
            <h1 id="dashboard-greeting" class="text-2xl font-bold text-neutral-100 tracking-tight flex items-center gap-2">
                Dzień dobry!
            </h1>
        </div>
        <div class="flex items-center gap-1.5">
            <button class="js-open-cart w-9 h-9 rounded-full bg-[#0f2334] border border-[#004a77]/50 text-[#c2e7ff] flex items-center justify-center active:scale-90 transition-transform text-sm shadow-sm" title="Szybkie zakupy">🛒</button>
            <button class="js-open-history w-9 h-9 rounded-full bg-[#1e1f20] border border-[#333537] text-neutral-200 flex items-center justify-center active:scale-90 transition-transform text-sm shadow-sm" title="Historia">🕒</button>
            <button class="js-open-search w-9 h-9 rounded-full bg-[#1e1f20] border border-[#333537] text-neutral-200 flex items-center justify-center active:scale-90 transition-transform text-sm shadow-sm" title="Szukaj">🔍</button>
<button onclick="window.switchView('calendar')" class="w-9 h-9 rounded-full bg-[#1e1f20] border border-[#333537] text-neutral-200 flex items-center justify-center active:scale-90 transition-transform text-sm shadow-sm" title="Kalendarz">📅</button>
            <button class="js-open-search w-9 h-9 rounded-full bg-[#1e1f20] border border-[#333537] text-neutral-200 flex items-center justify-center active:scale-90 transition-transform text-sm shadow-sm" title="Szukaj">🔍</button>
        </div>
    </header>

    <div id="dashboard-today-container" class="mb-6 hidden"></div>

    <div class="flex flex-col gap-3 mb-6">
        
        <div class="bg-[#1e1f20] border border-[#333537] rounded-[24px] overflow-hidden shadow-sm">
            <div class="js-toggle-widget flex items-center justify-between p-4 cursor-pointer active:bg-[#252627] transition-colors select-none" data-target="widget-home-content">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">🏠</span>
                    <h2 class="text-base font-bold text-neutral-100">Dom</h2>
                </div>
                <div class="flex items-center gap-2">
                    <div id="widget-home-badges" class="flex gap-1"></div>
                    <span class="js-chevron text-neutral-500 transition-transform duration-200 ml-1" id="widget-home-chevron">▼</span>
                </div>
            </div>
            <div id="widget-home-content" class="hidden border-t border-[#333537]/50 bg-[#131314]/50 p-2"></div>
        </div>

        <div class="bg-[#1e1f20] border border-[#333537] rounded-[24px] overflow-hidden shadow-sm">
            <div class="js-toggle-widget flex items-center justify-between p-4 cursor-pointer active:bg-[#252627] transition-colors select-none" data-target="widget-health-content">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">❤️</span>
                    <h2 class="text-base font-bold text-neutral-100">Zdrowie</h2>
                </div>
                <div class="flex items-center gap-2">
                    <div id="widget-health-badges" class="flex gap-1"></div>
                    <span class="js-chevron text-neutral-500 transition-transform duration-200 ml-1" id="widget-health-chevron">▼</span>
                </div>
            </div>
            <div id="widget-health-content" class="hidden border-t border-[#333537]/50 bg-[#131314]/50 p-2"></div>
        </div>

        <div class="bg-[#1e1f20] border border-[#333537] rounded-[24px] overflow-hidden shadow-sm">
            <div class="js-toggle-widget flex items-center justify-between p-4 cursor-pointer active:bg-[#252627] transition-colors select-none" data-target="widget-todo-content">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">📝</span>
                    <h2 class="text-base font-bold text-neutral-100">Zadania i Listy</h2>
                </div>
                <div class="flex items-center gap-2">
                    <span id="widget-todo-badge" class="hidden px-2.5 py-1 bg-[#004a77]/30 text-[#a8c7fa] border border-[#004a77]/40 rounded-lg text-[10px] font-bold uppercase tracking-wider"></span>
                    <span class="js-chevron text-neutral-500 transition-transform duration-200 ml-1" id="widget-todo-chevron">▼</span>
                </div>
            </div>
            <div id="widget-todo-content" class="hidden border-t border-[#333537]/50 bg-[#131314]/50 p-2"></div>
        </div>

    </div>

    <div id="dashboard-horizon-container" class="mb-6"></div>

</div>

<div id="dashboard-history-overlay" class="fixed inset-0 z-50 bg-[#131314] hidden flex flex-col animate-fade-in">
    
    <div class="p-4 sm:p-6 border-b border-[#333537] bg-[#1e1f20] flex items-center gap-3 shrink-0">
        <button class="js-close-history text-neutral-400 text-3xl active:scale-90 pb-1 px-2 cursor-pointer">←</button>
        <div>
            <h2 class="text-lg font-bold text-neutral-100">Historia Ostatnich Zdarzeń</h2>
            <p class="text-[10px] text-neutral-500 uppercase tracking-widest mt-0.5">Kto i kiedy odhaczył</p>
        </div>
    </div>
    
    <div class="flex-1 min-h-0 overflow-y-auto overscroll-contain p-4 sm:p-6 pb-32 no-scrollbar" style="-webkit-overflow-scrolling: touch;" id="dashboard-history-list">
        </div>

</div>
