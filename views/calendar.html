<div class="ux-page">
    <header class="ux-header">
        <div><h1 class="ux-title">Kalendarz</h1><p id="calendar-subtitle" class="ux-muted">Wydarzenia i zadania z terminem</p></div>
        <div class="ux-toolbar"><button type="button" class="ux-icon-btn js-open-search" aria-label="Szukaj"><span data-ux-icon="search"></span></button><button type="button" class="ux-icon-btn js-dash-nav" data-view="settings" aria-label="Ustawienia"><span data-ux-icon="settings"></span></button><button type="button" class="ux-btn ux-btn-primary js-open-quick-add" data-kind="event"><span data-ux-icon="plus"></span> Dodaj</button></div>
    </header>
    <div class="ux-tabs" aria-label="Widok kalendarza">
        <button type="button" class="ux-tab js-cal-tab active" data-tab="agenda" aria-pressed="true">Agenda</button>
        <button type="button" class="ux-tab js-cal-tab" data-tab="month" aria-pressed="false">Miesiąc</button>
        <details class="ux-calendar-options"><summary class="ux-btn"><span data-ux-icon="more"></span> Więcej</summary><div class="ux-panel">
            <button type="button" class="ux-btn js-cal-tab" data-tab="year">Widok roku</button>
            <label class="ux-field" for="calendar-kind-filter">Rodzaj<select id="calendar-kind-filter" class="ux-input"><option value="all">Wszystkie wpisy</option><option value="event">Wydarzenia</option><option value="task">Zadania i listy</option><option value="episode">Przebieg zdrowia</option></select></label>
            <label class="ux-field" for="calendar-area-filter">Obszar<select id="calendar-area-filter" class="ux-input"><option value="all">Wszystkie obszary</option><option value="Dom">Dom</option><option value="Zdrowie">Zdrowie</option><option value="Ogólne">Ogólne</option></select></label>
            <label class="ux-field" for="calendar-person-filter">Osoba<select id="calendar-person-filter" class="ux-input"><option value="">Wszyscy</option></select></label>
            <label class="ux-field"><input id="calendar-history-filter" type="checkbox"> Pokaż historię i odwołane wydarzenia</label>
        </div></details>
    </div>
    <div id="calendar-active-filters" class="ux-toolbar"></div>
    <section id="cal-view-agenda"></section>
    <section id="cal-view-month" class="hidden"><header class="ux-header"><button type="button" class="ux-icon-btn js-cal-change-month" data-offset="-1" aria-label="Poprzedni miesiąc"><span data-ux-icon="back"></span></button><h2 id="cal-month-title" class="ux-section"></h2><button type="button" class="ux-icon-btn js-cal-change-month" data-offset="1" aria-label="Następny miesiąc"><span data-ux-icon="forward"></span></button></header><div id="cal-month-grid"></div></section>
    <section id="cal-view-year" class="hidden"><header class="ux-header"><button type="button" class="ux-icon-btn js-cal-change-year" data-offset="-1" aria-label="Poprzedni rok"><span data-ux-icon="back"></span></button><h2 id="cal-year-title" class="ux-section"></h2><button type="button" class="ux-icon-btn js-cal-change-year" data-offset="1" aria-label="Następny rok"><span data-ux-icon="forward"></span></button></header><div id="cal-year-grid" class="ux-calendar-years"></div></section>
    <section id="calendar-day-details" class="ux-section hidden"></section>
</div>
