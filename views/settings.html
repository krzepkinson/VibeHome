<div class="ux-page">
 <header class="ux-header"><h1 class="ux-title">Ustawienia</h1><button type="button" class="ux-icon-btn js-open-search" aria-label="Szukaj"><span data-icon="search"></span></button></header>
 <label class="ux-field" for="settings-user-name">Twoje imię</label><div class="ux-toolbar" style="justify-content:stretch"><input id="settings-user-name" maxlength="50" class="ux-input" style="flex:1"><button type="button" class="ux-btn" onclick="window.saveUserName()">Zapisz</button></div>
 <button type="button" class="ux-row" onclick="window.openProfilesSettings()"><span data-icon="people"></span><span class="ux-row-main"><span class="ux-row-title">Osoby</span><span class="ux-row-meta">Profile zdrowotne i wizyty</span></span><span data-icon="chevron"></span></button>
 <button type="button" class="ux-row" onclick="window.openRoomsSettings()"><span data-icon="room"></span><span class="ux-row-main"><span class="ux-row-title">Pomieszczenia</span><span class="ux-row-meta">Kontekst zadań domowych</span></span><span data-icon="chevron"></span></button>
 <section class="ux-section"><h2 class="ux-section-title">Powiadomienia o terminach</h2><div class="ux-between"><p id="notif-status-text" class="ux-row-meta">Sprawdzam konfigurację…</p><button type="button" class="ux-btn hidden" id="notif-enable-btn" onclick="window.requestNotificationPermission()">Włącz</button></div><p class="ux-hint">Przypomnienia dotyczą ustawionych terminów. Leki i suplementy w apteczce nie tworzą przypomnień o dawkach.</p></section>
 <section class="ux-section"><h2 class="ux-section-title">Wspólny dom</h2><p class="ux-row-meta">Kod domu</p><p id="household-id-label" class="ux-description" style="overflow-wrap:anywhere">Wczytywanie…</p><div class="ux-actions"><button type="button" class="ux-btn" onclick="navigator.clipboard.writeText(window.currentUser.household_id).then(()=>window.showToast('Skopiowano kod domu.')).catch(()=>window.showToast('Zaznacz i skopiuj kod z ekranu.'))">Kopiuj kod</button><button type="button" class="ux-btn" onclick="window.openJoinHouseholdModal()">Dołącz do domu</button></div></section>
 <button type="button" class="ux-row" onclick="window.openArchiveScreen()"><span data-icon="archive"></span><span class="ux-row-main"><span class="ux-row-title">Archiwum</span><span class="ux-row-meta">Zarchiwizowane wpisy i przywracanie</span></span><span data-icon="chevron"></span></button>
 <div class="ux-actions"><button type="button" class="ux-btn ghost ux-danger" onclick="window.logoutUser()"><span data-icon="logout"></span>Wyloguj się</button></div>
</div>
