<div class="max-w-xl mx-auto p-4 sm:p-6 relative min-h-[90vh] animate-fade-in">
    <header class="mb-6 mt-2 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-medium text-neutral-100 tracking-wide flex items-center gap-2">
                <span id="profile-name-title">Ładowanie...</span>
            </h1>
            <p class="text-xs text-[#ffb4ab] font-medium">Centrum Zdrowia</p>
        </div>
        <div class="flex items-center gap-1.5">
            <button class="js-toggle-health-view w-9 h-9 rounded-full bg-[#1e1f20] border border-[#333537] text-neutral-200 flex items-center justify-center active:scale-90 transition-transform text-sm cursor-pointer" id="health-view-toggle-btn" title="Zmień widok">📅</button>
            <button class="js-open-health-book w-9 h-9 rounded-full bg-[#1e1f20] border border-[#333537] text-neutral-200 flex items-center justify-center active:scale-90 transition-transform text-sm cursor-pointer" title="Książeczka Zdrowia">📖</button>
            <button class="js-open-pharmacy w-9 h-9 rounded-full bg-[#1e1f20] border border-[#333537] text-neutral-200 flex items-center justify-center active:scale-90 transition-transform text-sm cursor-pointer" title="Domowa Apteczka">💊</button>
            <button class="js-toggle-profile-switcher w-9 h-9 rounded-full bg-[#444746] text-neutral-200 flex items-center justify-center font-bold border-2 border-[#131314] shadow-md active:scale-90 transition-transform text-xs cursor-pointer" id="health-header-avatar">?</button>
            <button class="js-open-search w-10 h-10 rounded-full bg-[#1e1f20] border border-[#333537] text-neutral-400 flex items-center justify-center active:scale-90 transition-transform text-base" title="Szukaj">🔍</button>
        </div>
    </header>

    <div id="health-profile-pills" class="flex gap-2 overflow-x-auto no-scrollbar pb-3 mb-1 hidden">
    </div>

    <div id="health-calendar-wrapper" class="hidden bg-[#1e1f20] p-4 rounded-[28px] border border-[#333537] mb-6 transition-all">
        <div class="flex justify-between items-center mb-4">
            <button class="js-change-cal-month w-8 h-8 flex justify-center items-center rounded-full text-neutral-400 hover:bg-[#333537] active:scale-90 cursor-pointer" data-offset="-1">&lt;</button>
            <h3 class="font-medium text-neutral-200 uppercase tracking-widest text-xs" id="calendar-title">Miesiąc Rok</h3>
            <button class="js-change-cal-month w-8 h-8 flex justify-center items-center rounded-full text-neutral-400 hover:bg-[#333537] active:scale-90 cursor-pointer" data-offset="1">&gt;</button>
        </div>
        <div id="calendar-container"></div>
    </div>

    <div id="health-sections-wrapper">
        <div id="health-active-section" class="mb-6 hidden">
            <h3 class="text-[10px] font-medium text-rose-400 uppercase tracking-widest pl-1 mb-2 flex items-center gap-1.5">
                <span class="animate-pulse">🔴</span> Teraz trwa / Do uruchomienia
            </h3>
            <div id="health-active-list" class="space-y-2"></div>
        </div>

        <div id="health-upcoming-section" class="mb-6 hidden">
            <h3 class="text-[10px] font-medium text-amber-200 uppercase tracking-widest pl-1 mb-2 flex items-center gap-1.5">
                <span>📅</span> Nadchodzące
            </h3>
            <div id="health-upcoming-list" class="space-y-2"></div>
        </div>

        <div id="health-routine-section" class="mb-20">
            <h3 class="text-[10px] font-medium text-[#c4eed0] uppercase tracking-widest pl-1 mb-2 flex items-center gap-1.5">
                <span>🔄</span> Rutyna i cykle
            </h3>
            <div id="health-routine-list" class="space-y-2"></div>
        </div>
    </div>

    <button class="js-open-health-fab-menu fixed bottom-20 right-4 sm:right-auto sm:ml-[480px] w-14 h-14 bg-[#8c1d18] text-[#ffdad6] rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.5)] border border-rose-500/30 hover:bg-[#a8251e] active:scale-90 flex items-center justify-center text-3xl pb-1 z-40 transition-all cursor-pointer">
        +
    </button>
</div>
