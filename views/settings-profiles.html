<div class="fixed inset-0 z-[60] bg-[#131314] flex flex-col transition-all duration-300 animate-fade-in">
    <div class="p-4 sm:p-6 border-b border-[#333537] flex items-center gap-3 bg-[#1e1f20]">
        <button onclick="window.goBack()" class="text-neutral-400 text-2xl active:scale-90 transition-transform pb-1 px-2">←</button>
        <div class="flex-1">
            <h1 class="text-lg font-medium text-neutral-100">Domownicy</h1>
            <p class="text-[10px] text-neutral-500 uppercase tracking-widest">Profile użytkowników</p>
        </div>
        <button onclick="window.openNewProfileModal()" class="w-10 h-10 bg-[#e3e3e3] text-[#131314] rounded-full flex items-center justify-center text-2xl pb-1 shadow-md active:scale-90 transition-transform cursor-pointer">+</button>
    </div>
    <div class="p-4 sm:p-6 flex-1 overflow-y-auto no-scrollbar">
        <div id="settings-profiles-list" class="space-y-2"></div>
    </div>
</div>

<div id="edit-profile-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[70] flex justify-center items-center p-4">
    <div class="bg-[#1e1f20] rounded-[28px] border border-[#333537] w-full max-w-sm p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-medium text-neutral-100 tracking-wide" id="edit-profile-title">Edytuj domownika</h3>
            <button onclick="window.closeEditProfileModal()" class="w-8 h-8 rounded-full bg-[#333537] text-neutral-200 flex items-center justify-center font-medium active:scale-90 transition-transform cursor-pointer">✕</button>
        </div>
        
        <input type="hidden" id="edit-profile-id">
        
        <div class="space-y-4">
            <div>
                <label class="block text-[10px] uppercase tracking-wider text-neutral-500 mb-1 pl-1">Imię</label>
                <input type="text" id="edit-profile-name" maxlength="50" placeholder="Imię domownika" class="w-full p-4 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none focus:border-[#a8c7fa]">
            </div>
            
            <div>
                <label class="block text-[10px] uppercase tracking-wider text-neutral-500 mb-1 pl-1">Data Urodzenia (Opcjonalnie)</label>
                <input type="date" id="edit-profile-birth" class="w-full p-4 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none [color-scheme:dark]">
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-neutral-500 mb-1 pl-1">Wzrost (cm)</label>
                    <input type="number" id="edit-profile-height" placeholder="Opcj." class="w-full p-4 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-neutral-500 mb-1 pl-1">Waga (kg)</label>
                    <input type="number" id="edit-profile-weight" placeholder="Opcj." step="0.1" class="w-full p-4 rounded-[20px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none">
                </div>
            </div>
        </div>
        
        <div class="flex gap-3 mt-6">
            <button onclick="window.deleteProfile()" class="w-12 h-12 shrink-0 rounded-full bg-[#3c1414] text-[#ffb4ab] border border-[#8c1d18]/50 flex items-center justify-center active:scale-95 transition-transform text-lg cursor-pointer" title="Usuń trwale">🗑️</button>
            <button onclick="window.saveProfileDetails()" class="flex-1 bg-[#a8c7fa] text-[#004a77] font-bold py-3 text-sm rounded-[24px] active:scale-95 transition-transform cursor-pointer">Zapisz Zmiany</button>
        </div>
    </div>
</div>
