<div class="ux-page">
  <header class="ux-header"><h1 id="health-settings-title-top" class="ux-title">Edytuj zapis zdrowotny</h1><button type="button" class="ux-icon-btn js-close-health-settings" aria-label="Wróć"><span data-ux-icon="back"></span></button></header>
  <label class="ux-form-field" for="health-settings-name">Nazwa</label><input id="health-settings-name" class="ux-input" maxlength="150">
  <label class="ux-form-field" for="health-settings-category">Kategoria</label><select id="health-settings-category" class="ux-input"><option value="Infekcja">Objaw lub choroba</option><option value="Zabieg">Zabieg / pielęgnacja</option><option value="Inne">Inne</option><option value="Suplementacja">Dawny wpis suplementacji (tylko historia)</option></select>
  <div id="health-settings-interval-wrapper" class="hidden"><label class="ux-form-field" for="health-settings-interval">Powtarzanie co (dni)</label><input id="health-settings-interval" class="ux-input" type="number" min="0"><label class="ux-form-field" for="health-settings-remind-days">Przypomnij dni przed</label><input id="health-settings-remind-days" class="ux-input" type="number" min="0"></div>
  <div id="health-settings-date-wrapper" class="hidden"><label class="ux-form-field" for="health-settings-date">Termin</label><input id="health-settings-date" class="ux-input" type="datetime-local"><label class="ux-form-field" for="health-settings-remind-date">Przypomnij dni przed</label><input id="health-settings-remind-date" class="ux-input" type="number" min="0"></div>
  <div class="ux-actions"><button type="button" class="ux-btn ghost js-delete-health-task"><span data-ux-icon="archive"></span> Archiwizuj</button><button type="button" class="ux-btn primary js-save-health-settings">Zapisz zmiany</button></div>
  <p class="ux-row-meta">Archiwizacja ukrywa definicję w aktywnych wpisach; wcześniejsze zapisy pozostają w historii.</p>
</div>
