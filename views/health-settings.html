<div class="max-w-xl mx-auto p-4 sm:p-6 relative min-h-[90vh] animate-fade-in pb-24">
    <header class="mb-6 mt-2 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-medium text-neutral-100 tracking-wide" id="health-settings-title-top">Ustawienia zadania</h1>
            <p class="text-xs text-neutral-500 uppercase tracking-widest mt-1">Edycja zdarzenia</p>
        </div>
        <button class="js-close-health-settings w-10 h-10 rounded-full bg-[#1e1f20] border border-[#333537] text-neutral-400 flex items-center justify-center active:scale-90 transition-transform">✕</button>
    </header>

    <div class="space-y-4">
        <div class="bg-[#1e1f20] rounded-[24px] border border-[#333537] p-5 shadow-sm">
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-neutral-500 mb-1.5 font-bold pl-1">Nazwa</label>
                    <input type="text" id="health-settings-name" class="w-full p-3.5 rounded-[16px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none focus:border-[#a8c7fa]">
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-neutral-500 mb-1.5 font-bold pl-1">Kategoria</label>
                    <select id="health-settings-category" class="w-full p-3.5 rounded-[16px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none cursor-pointer">
                        <option value="Infekcja">Infekcja</option>
                        <option value="Suplementacja">Suplementacja</option>
                        <option value="Zabieg">Zabieg / Pielęgnacja</option>
                        <option value="Inne">Inne</option>
                    </select>
                </div>

                <div id="health-settings-interval-wrapper">
                    <label class="block text-[10px] uppercase tracking-widest text-neutral-500 mb-1.5 font-bold pl-1">Częstotliwość (dni)</label>
                    <div class="flex gap-2">
                        <div class="flex-1">
                            <label class="block text-[10px] text-neutral-500 mb-1 pl-1">Co ile dni?</label>
                            <input type="number" id="health-settings-interval" class="w-full p-3.5 rounded-[16px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none">
                        </div>
                        <div class="flex-1">
                            <label class="block text-[10px] text-neutral-500 mb-1 pl-1">Przypomnij dni przed</label>
                            <input type="number" id="health-settings-remind-days" class="w-full p-3.5 rounded-[16px] bg-[#131314] border border-[#333537] text-neutral-200 text-sm focus:outline-none">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-[#1e1f20] rounded-[24px] border border-[#333537] p-5 shadow-sm">
            <button class="js-delete-health-task w-full py-3.5 bg-[#3c1414]/30 border border-[#8c1d18]/50 text-[#ffb4ab] rounded-[16px] font-bold text-sm active:scale-95 transition-transform">Archiwizuj zdarzenie</button>
            <p class="text-[9px] text-center text-neutral-500 uppercase tracking-widest mt-3">Spowoduje ukrycie na liście i zatrzymanie powiadomień</p>
        </div>
    </div>

    <div class="fixed bottom-6 left-4 right-4 max-w-xl mx-auto z-40">
        <button class="js-save-health-settings w-full bg-[#a8c7fa] text-[#004a77] font-bold py-4 rounded-full shadow-lg active:scale-95 transition-transform text-sm">Zapisz zmiany</button>
    </div>
</div>
